})();

const qrCache = new Map();
function qrFor(text) {
  if (!qrCache.has(text)) {
    try { qrCache.set(text, QR.make(text)); } catch (e) { qrCache.set(text, null); }
  }
  return qrCache.get(text);
}
function drawQR(qr, x, y, box) {
  if (!qr) return;
  const cell = Math.max(3, Math.floor(box / (qr.size + 6)));
  const pad = cell * 3;
  const w = qr.size * cell + pad * 2;
  ctx.fillStyle = '#ffffff';
  roundRect(ctx, x, y, w, w, 10); ctx.fill();
  ctx.fillStyle = '#0a0f19';
  for (let my = 0; my < qr.size; my++) {
    const rowBase = my * qr.size;
    for (let mx = 0; mx < qr.size; mx++) {
      if (qr.modules[rowBase + mx]) {
        ctx.fillRect(x + pad + mx * cell, y + pad + my * cell, cell + 0.5, cell + 0.5);
      }
    }
  }
  return w;
}

const keys = Object.create(null);

const LAN = /[?&]lan(=|&|$)/.test(SEARCH);

  return m ? (Number(m[1]) | 0) : 20261029;
})();

let naiveMode = NAIVE;
let soloMode = /[?&]solo/.test(typeof location !== 'undefined' ? location.search : '');
const AUTO_DIFF = (function () {
  const m = SEARCH.match(/[?&]diff=(\w+)/);
  return m && DIFFS[m[1]] ? m[1] : 'normal';
})();

const DEMO_DIFF = Object.assign({}, DIFFS.normal, { dark: 0.70, rain: 0.35 });

function pollPads() {
  padIn.steer = 0; padIn.gas = 0; padIn.brake = 0; padIn.up = 0; padIn.down = 0; padIn.horn = 0;
  if (!navigator || !navigator.getGamepads) return;
  let list;
  try { list = navigator.getGamepads(); } catch (e) { return; }
  if (!list) return;
  const live = [];
  for (let i = 0; i < list.length; i++) if (list[i] && list[i].connected) live.push(list[i]);
  if (!live.length) return;
  const P1 = live[0], P2 = live[1] || null;
  const dz = (v) => (Math.abs(v) < 0.18 ? 0 : v);
  padIn.steer = clamp(dz(P1.axes && P1.axes[0] || 0), -1, 1);
  const rt = P1.buttons && P1.buttons[7];
  if (rt && (rt.value > 0.1 || rt.pressed)) padIn.gas = 1;
  const readP2 = (pad) => {
    const lt = pad.buttons && pad.buttons[6];
    if (lt && (lt.value > 0.1 || lt.pressed)) padIn.brake = 1;
    const lb = pad.buttons && pad.buttons[4], rb = pad.buttons && pad.buttons[5];
    if (lb && lb.pressed) padIn.down = 1;
    if (rb && rb.pressed) padIn.up = 1;
    const b0 = pad.buttons && pad.buttons[0];
    if (b0 && b0.pressed) padIn.horn = 1;
  };
  readP2(P2 || P1);
}

/**
 * 合并键盘 / 手柄 / 手机，返回这一帧的操作。
 * 座位分工：司机只有 A/D + W；副驾拿 ↑↓ 换挡、空格 刹车、L 鸣笛。
 */
function readInput() {
  let steer = 0, gas = 0, brake = 0, up = 0, down = 0, horn = 0;
  if (keys.KeyA) steer -= 1;
  if (keys.KeyD) steer += 1;
  if (keys.KeyW) gas = 1;
  if (keys.Space || keys.KeyJ) brake = 1;
  if (keys.ArrowUp || keys.KeyI) up = 1;
  if (keys.ArrowDown || keys.KeyK) down = 1;
  if (keys.KeyL || keys.Numpad0) horn = 1;

  if (padIn.steer) steer = padIn.steer;
  gas = gas || padIn.gas;
  brake = brake || padIn.brake;
  up = up || padIn.up;
  down = down || padIn.down;
  horn = horn || padIn.horn;

  /* 手机当副驾/方向盘：手机会话优先 */
  if (lan.pads[0] && !lan.stale[0] && lan.ctl[0]) {
    steer = lan.ctl[0].steer;
    gas = lan.ctl[0].gas;
  }
  if (lan.pads[1] && !lan.stale[1] && lan.ctl[1]) {
    brake = lan.ctl[1].brake;
    up = lan.ctl[1].up;
    down = lan.ctl[1].down;
    horn = lan.ctl[1].horn;
  }
  return {
    steer: clamp(steer, -1, 1), gas: gas ? 1 : 0, brake: brake ? 1 : 0,
    up: up ? 1 : 0, down: down ? 1 : 0, horn: horn ? 1 : 0
  };
}

/* ═══════════════ 16. 手机联机（局域网） ═══════════════ */
const lan = { ok: false, pads: [false, false], ctl: [null, null], at: [0, 0], stale: [false, false], url: '', ws: null, acc: 0, needTrack: false };

function lanPadURL(p) {
  let base = '';
  if (typeof location !== 'undefined') {
    const h = location.hostname;
    const local = (h === 'localhost' || h === '127.0.0.1' || h === '::1' || h === '0.0.0.0');
    if (!local) base = location.protocol + '//' + location.host;
  }
  if (!base) base = lan.url || (typeof location !== 'undefined' ? location.protocol + '//' + location.host : '');
  return base + '/c?p=' + p;
}

function lanInit() {
  if (!LAN || typeof WebSocket === 'undefined') return;
  const base = ((typeof location !== 'undefined' && location.protocol === 'https:') ? 'wss://' : 'ws://') +
    ((typeof location !== 'undefined') ? location.host : '');
  const connect = () => {
    let ws;
    try { ws = new WebSocket(base + '/ws?role=host'); } catch (e) { setTimeout(connect, 1500); return; }
    lan.ws = ws;
    ws.onopen = () => { lan.ok = true; lan.needTrack = true; };
    ws.onmessage = (ev) => {
      let m;
      try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.t === 'status') {
        lan.pads = [!!(m.pads && m.pads[0]), !!(m.pads && m.pads[1])];
        if (m.url) lan.url = m.url;
        lan.needTrack = true;
      } else if (m.t === 'mark') {
        addMark(Number(m.m) || 0);
      } else if (m.t === 'in' && m.p) {
        const k = m.p - 1;
        lan.ctl[k] = {
          steer: clamp(Number(m.steer) || 0, -1, 1),
          gas: m.gas ? 1 : 0, brake: m.brake ? 1 : 0,
          up: m.up ? 1 : 0, down: (m.dn || m.rev) ? 1 : 0, horn: m.horn ? 1 : 0
        };
        lan.pads[k] = true;
        lan.at[k] = gameTime;
        lan.stale[k] = false;
      }
    };
    ws.onclose = () => { lan.ok = false; lan.pads = [false, false]; setTimeout(connect, 1500); };
    ws.onerror = () => {};
  };
  connect();
}

function lanSend(obj) {
  if (!lan.ok || !lan.ws || lan.ws.readyState !== 1) return false;
  try { lan.ws.send(JSON.stringify(obj)); return true; } catch (e) { return false; }
}

/** 开跑时把赛道推给副驾手机（降采样到 32px 一点，够画雷达图） */
function lanSendTrack() {
  lan.needTrack = true;
  if (!track) return;
  /* 手机端全部按「米」画（12px = 1m），这里统一换算 */
  const PPM = 12;
  const step = 4, pts = [], half = [];
  for (let i = 0; i < track.pts.length; i += step) {
    pts.push([+(track.pts[i].x / PPM).toFixed(2), +(track.pts[i].y / PPM).toFixed(2)]);
    half.push(+(track.half[i] / PPM).toFixed(1));
  }
  const d = {
    k: 'track', pts, half,
    len: Math.round(track.total / PPM),
    haz: track.haz.map((h) => [Math.round(h[0] / PPM), h[1]])
  };
  if (lanSend({ t: 'h2p', p: 2, d })) lan.needTrack = false;
}

function lanTick(dt) {
  if (!LAN) return;
  if (lan.needTrack) lanSendTrack();
  /* 掉线保护：0.6s 没收到就归零，避免车自己往前冲 */
  for (let i = 0; i < 2; i++) {
    if (lan.pads[i] && !lan.stale[i] && gameTime - lan.at[i] > 0.6) {
      lan.stale[i] = true;
      if (lan.ctl[i]) lan.ctl[i] = { steer: 0, gas: 0, brake: 0, up: 0, down: 0, horn: 0 };
    }
  }
  lan.acc += dt;
  if (lan.acc < 0.1) return;
  lan.acc = 0;
  const PPM = 12;
  const d = {
    k: 'tick', s: Math.round(car.s / PPM), x: +(car.x / PPM).toFixed(2), y: +(car.y / PPM).toFixed(2),
    a: car.a, spd: Math.round(kmh(Math.abs(car.vf))), heat: car.heat, fuel: car.fuel / CFG.fuel.max,
    rpm: Math.round(car.rpm), rpmRed: CFG.rpm.red, rpmMax: CFG.rpm.max,
    gear: car.gear, boost: car.boostT > 0 ? 1 : 0,
    prog: clamp(car.s / track.total, 0, 1)
  };
  lanSend({ t: 'h2p', p: 2, d });
  lanSend({ t: 'h2p', p: 1, d });
}


/* ═══════════════ 17. 自动驾驶（只给截图/测试用） ═══════════════ */
const autoMem = { stuck: 0, rev: 0, lastS: 0, cool: 0 };
function autopilot(tr, c) {
  /* 卡住了就倒车脱困（真人也会这么干）；用"位移"判断，别用瞬时速度——速度在 0 附近抖会反复触发 */
  autoMem.cool = Math.max(0, autoMem.cool - STEP);
  if (Math.abs(c.s - autoMem.lastS) < 2.5) autoMem.stuck += STEP;
  else { autoMem.stuck = 0; autoMem.lastS = c.s; }
  if (autoMem.stuck > 1.0 && autoMem.cool <= 0) { autoMem.rev = 0.8; autoMem.stuck = 0; autoMem.cool = 2.2; }
  if (autoMem.rev > 0) {
    autoMem.rev -= STEP;
    const p0 = sampleAt(tr, c.s + 60);
    const want0 = Math.atan2(p0.x - c.x, -(p0.y - c.y));
    return {
      steer: clamp(-angDiff(c.a, want0) * 2.2, -1, 1),
      gas: c.gear === 0 ? 1 : 0, brake: 0,
      up: 0, down: c.gear === 0 ? 0 : 1, horn: 0
    };
  }
  /* 提前看前方 5 段曲率，取最严的那个安全车速 */
  let vLim = CFG.speed.max;
  for (let d = 40; d <= 420; d += 95) {
    vLim = Math.min(vLim, safeSpeed(curvatureAt(tr, c.s + d, 190)) * 1.06);
  }
  const v = Math.abs(c.vf);
  const look = 110 + v * 0.30;
  const p = sampleAt(tr, c.s + look);
  const want = Math.atan2(p.x - c.x, -(p.y - c.y));
  const err = angDiff(c.a, want);
  const steer = clamp(err * 2.9, -1, 1);

  /* 前方有牛就鸣笛 */
  let horn = 0;
  for (const w of cows) {
    if (!w.alive || w.scared > 0) continue;
    const ds = w.s - c.s;
    if (ds > 30 && ds < 260 && dist2(w.x, w.y, c.x, c.y) < 300 * 300) { horn = 1; break; }
  }
  /* ?naive=1：模拟"一路踩死油门、只会打方向"的新手，用来验"这个弯到底抢不抢速度" */
  /* 换挡：顶到红线就升，目标速度掉下来了就降（引擎制动） */
  let up = 0, down = 0;
  if (c.gear === 0) up = 1;
  else {
    if (c.rpm > 6000 && c.gear < 4) up = 1;
    if (c.gear > 1 && c.rpm < 1900) down = 1;
    else if (c.gear > 1 && vLim < gearMax(c.gear - 1) * 0.92 && v > vLim + 15) down = 1;
  }
  if (soloMode) { up = 0; down = 0; }      // 模拟"司机一个人玩"：够不到换挡键
  const gas = naiveMode ? 1 : (v < vLim - 6 ? 1 : 0);
  const brake = naiveMode
    ? (Math.abs(err) > 0.75 || (v > 320 && Math.abs(err) > 0.42) ? 1 : 0)
    : (v > vLim + 12 ? 1 : 0);
  return { steer, gas, brake, up, down, horn };
}

/* ═══════════════ 19. 键盘 ═══════════════ */
function onKeyDown(ev) {
  const code = ev.code || '';
  if (!actx) AC();
  keys[code] = 1;
  if (ev.repeat) return;
  if (ev.preventDefault) ev.preventDefault();

  if (code === 'KeyM') { muted = !muted; prefs.muted = muted; applyMute(); store('twinDrive.prefs', prefs); return; }

  if (qrOverlay) {
    if (code === 'KeyQ' || code === 'Escape' || code === 'Enter') { qrOverlay = false; SFX.deny(); }
    return;
  }

  if (state === 'menu') {
    const go = () => {
      AC();
      diffName = DIFF_KEYS[menuSel];
      if (menuMode === 1) startRally(null);
      else startRun(null, DIFF_KEYS[menuSel]);
    };
    if (code === 'ArrowLeft') { menuSel = (menuSel + 2) % 3; SFX.beep(false); }
    else if (code === 'ArrowRight') { menuSel = (menuSel + 1) % 3; SFX.beep(false); }
    else if (code === 'ArrowUp' || code === 'ArrowDown' || code === 'KeyS') {
      menuMode = menuMode === 1 ? 0 : 1;
      SFX.beep(false);
    } else if (code === 'Digit1' || code === 'Digit2' || code === 'Digit3') {
      menuSel = Number(code.slice(5)) - 1;
      go();
    } else if (code === 'Space' || code === 'Enter' || code === 'NumpadEnter') {
      go();
    } else if (code === 'KeyQ' && LAN) {
      qrOverlay = true;
    }
    return;
  }

  if (code === 'KeyP' || code === 'Escape') {
    if (state === 'playing' || state === 'countdown') {
      prevState = state; state = 'paused'; pauseSel = 0;
      engineStop();
    } else if (state === 'paused') {
      state = prevState || 'playing';
      if (state === 'playing') engineStart();
    } else if (state === 'result') {
      state = 'menu';
    }
    return;
  }

  if (state === 'paused') {
    if (code === 'ArrowUp') pauseSel = (pauseSel + pauseRows().length - 1) % pauseRows().length;
    else if (code === 'ArrowDown') pauseSel = (pauseSel + 1) % pauseRows().length;
    else if (code === 'ArrowLeft') setVolume(prefs.volume - 0.1);
    else if (code === 'ArrowRight') setVolume(prefs.volume + 0.1);
    else if (code === 'Enter' || code === 'NumpadEnter' || code === 'Space') pauseActivate();
    return;
  }

  if (state === 'stageOver') {
    if (code === 'Space' || code === 'Enter' || code === 'NumpadEnter') startStage();
    else if (code === 'Escape') { state = 'menu'; engineStop(); }
    return;
  }

  if (state === 'result') {
    const wasRally = !!(result && result.rally);
    if (code === 'KeyR') {
      /* 重跑同一条：种子不变，幽灵车会跟着一起跑 */
      if (wasRally) startRally(result.seed); else startRun(result ? result.seed : null, diffName);
    } else if (code === 'KeyN') {
      if (wasRally) startRally(null); else startRun(null, diffName);
    } else if (code === 'Space' || code === 'Enter' || code === 'Escape') state = 'menu';
    return;
  }
}

function onKeyUp(ev) { delete keys[ev.code || '']; }

/* ═══════════════ 19b. 触屏（iPad 两人同屏） ═══════════════
 * 按钮 = 虚拟按键：按下走 onKeyDown、松开走 onKeyUp，菜单/暂停/结算全部沿用键盘逻辑。
 * 座位分工照键盘：左边司机（转向 + 油门），右边领航（降档 / 刹车 / 升档 / 鸣笛）。 */
const TOUCH_LAYOUT = {
  drive: [
    [['◀', 'KeyA', 'p1 big'], ['▶', 'KeyD', 'p1 big'], ['油门', 'KeyW', 'p1 big']],
    [['暂停', 'KeyP', '']],
    [['降档', 'ArrowDown', 'p2'], ['刹车', 'Space', 'p2 big'], ['升档', 'ArrowUp', 'p2 big'], ['鸣笛', 'KeyL', 'p2']]
  ],
  menu: [
    [['◀ 难度', 'ArrowLeft', ''], ['难度 ▶', 'ArrowRight', '']],
    [['发车', 'Space', 'p1 big']],
    [['单段 / 拉力', 'KeyS', ''], ['静音', 'KeyM', '']]
  ],
  paused: [
    [['▲', 'ArrowUp', ''], ['▼', 'ArrowDown', '']],
    [['确认', 'Enter', 'p1 big']],
    [['音量 −', 'ArrowLeft', ''], ['音量 +', 'ArrowRight', ''], ['继续', 'KeyP', 'p2']]
  ],
  stageOver: [[['退出拉力', 'Escape', '']], [['下一段', 'Space', 'p1 big']], []],
  result: [[['主菜单', 'Space', '']], [['重跑这条', 'KeyR', 'p1 big']], [['换新赛道', 'KeyN', 'p2 big']]]
};
let touchShown = '';
function touchGroup() {
  if (state === 'countdown' || state === 'playing') return 'drive';
  return TOUCH_LAYOUT[state] ? state : 'menu';
}
function touchSync() {
  if (!TOUCH) return;
  const g = touchGroup();
  if (g === touchShown) return;
  touchShown = g;
  /* 换画面时松开所有虚拟键，免得上一屏按住的键带进下一屏 */
  for (const k in keys) delete keys[k];
  const bar = document.getElementById('touch');
  bar.innerHTML = '';
  TOUCH_LAYOUT[g].forEach((grp, i) => {
    const box = document.createElement('div');
    box.className = i === 1 ? 'mid' : 'side';
    for (const [label, code, cls] of grp) {
      const b = document.createElement('button');
      b.textContent = label; b.className = cls;
      const held = new Set();
      const up = (e) => {
        if (!held.has(e.pointerId)) return;
        held.delete(e.pointerId);
        if (!held.size) { b.classList.remove('on'); onKeyUp({ code }); }
      };
      b.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        try { b.setPointerCapture(e.pointerId); } catch (err) { /* 老 Safari 没有也照样用 */ }
        held.add(e.pointerId);
        if (held.size > 1) return;
        b.classList.add('on');
        onKeyDown({ code, repeat: false, preventDefault() {} });
      });
      b.addEventListener('pointerup', up);
      b.addEventListener('pointercancel', up);
      b.addEventListener('contextmenu', (e) => e.preventDefault());
      box.appendChild(b);
    }
    bar.appendChild(box);
  });
}

function pauseActivate() {
  const i = pauseSel;
  if (i === 0) { state = prevState || 'playing'; if (state === 'playing') engineStart(); }
  else if (i === 1) { startRun(runSeed, diffName); }
  else if (i === 2) { startRun(null, diffName); }
  else if (i === 3) { state = 'menu'; engineStop(); }
  else if (i === 4) { setVolume(prefs.volume >= 0.99 ? 0.2 : prefs.volume + 0.2); }
  SFX.beep(false);
}

/* ═══════════════ 20. 主循环 ═══════════════ */
let engineAcc = 0;
let forceAuto = false;

function step(dt) {
  gameTime += dt;
  pollPads();
  if (toastT > 0) toastT -= dt;

  if (state === 'menu') return;

  if (state === 'countdown') {
    cdT -= dt;
    const seg = cdT > 1.5 ? 1 : cdT > 0.9 ? 2 : cdT > 0.3 ? 3 : 4;
    if (seg > beepStep) { beepStep = seg; SFX.beep(seg === 4); }
    if (cdT <= 0) { state = 'playing'; engineStart(); }
    return;
  }

  if (state !== 'playing') return;

  const ctl = (AUTO || forceAuto) ? autopilot(track, car) : readInput();
  stepCar(dt, ctl);
  if (state !== 'playing') return;

  updateHazards(dt);
  updateCamera(dt);
  stats.time += dt;

  /* 录幽灵：40Hz */
  if (ghostRec && (++ghostTick % 3 === 0)) {
    ghostRec.push(Math.round(car.x), Math.round(car.y), Math.round(car.a * 100), Math.round(car.s));
  }
  /* 和幽灵比里程 */
  const gh = ghostAt(stats.time);
  ghostDelta = gh ? (car.s - gh.s) / 12 : 0;
  lanTick(dt);

  engineAcc += dt;
  if (engineAcc > 0.05) { engineAcc = 0; engineTick(car.spd, ctl.gas, true); }
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = PAL.bg;
  ctx.fillRect(0, 0, W, H);

  if (state === 'menu') { drawMenuScene(); return; }

  if (state === 'result' || state === 'stageOver') {
    /* 结算/赛段卡不画车外场景，避免终点格纹透上来把数字压花 */
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0a1018');
    bg.addColorStop(1, '#05070c');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    const gl = ctx.createRadialGradient(W / 2, 220, 30, W / 2, 220, 420);
    gl.addColorStop(0, 'rgba(255,179,71,.10)');
    gl.addColorStop(1, 'rgba(255,179,71,0)');
    ctx.fillStyle = gl;
    ctx.fillRect(0, 0, W, H);
  } else {
    drawWorld();
    drawLights();
    drawMarks();
    drawCarBody();
    drawFlash();
  }

  if (state === 'playing' || state === 'countdown') {
    drawProgress();
    drawPanel();
    drawSpeed();
    drawTach();
    drawToast();
  }
  drawGhostEdge();

  if (state === 'countdown') drawCountdown();
  else if (state === 'paused') drawPause();
  else if (state === 'result') drawResult();
  else if (state === 'stageOver') drawStageCard();

  if (qrOverlay) drawQRs();
}

let lastTs = 0, acc = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  if (!isFinite(dt) || dt < 0) dt = 0;
  if (dt > 0.25) dt = 0.25;
  acc += dt;
  let guard = 0;
  while (acc >= STEP && guard++ < 12) { step(STEP); acc -= STEP; }
  if (guard >= 12) acc = 0;
  render();
  touchSync();
}

/* ═══════════════ 21. 启动 ═══════════════ */
makeGrassPattern();
if (typeof addEventListener === 'function') {
  addEventListener('keydown', onKeyDown);
  addEventListener('keyup', onKeyUp);
  addEventListener('blur', () => { for (const k in keys) delete keys[k]; });
}
lanInit();

/** ?auto=1&ff=6 —— 无头截图/自测用：直接发车，并先把前半段模拟掉 */
function autoBoot() {
  if (!AUTO) return;
  const wantRally = /[?&]rally/.test(SEARCH);
  const autoAdvance = /[?&]advance/.test(SEARCH);
  diffName = AUTO_DIFF;
  if (wantRally) startRally(AUTO_SEED); else startRun(AUTO_SEED, AUTO_DIFF);
  forceAuto = true;
  const m = SEARCH.match(/[?&]ff=([\d.]+)/);
  const mk = SEARCH.match(/[?&]mark=(\d+)/);
  if (mk) { setTimeout(() => addMark(Number(mk[1])), 0); addMarkNow = Number(mk[1]); }
  const ff = m ? Math.min(300, Number(m[1]) || 0) : 0;
  for (let i = 0; i < ff / STEP; i++) {
    step(STEP);
    if (autoAdvance && state === 'stageOver') onKeyDown({ code: 'Space', repeat: false, preventDefault() {} });
    if (addMarkNow && state === 'playing' && !marks.length) addMark(addMarkNow);
  }
  if (/[?&]pause/.test(SEARCH)) onKeyDown({ code: 'KeyP', repeat: false, preventDefault() {} });
  if (/[?&]qr/.test(SEARCH)) { qrOverlay = true; }
}

autoBoot();
requestAnimationFrame(frame);

/* ═══════════════ 22. 测试钩子 ═══════════════ */
window.__twinDrive = {

  setSolo(v) { soloMode = !!v; },
  press(code) { onKeyDown({ code, repeat: false, preventDefault() {} }); },
  release(code) { onKeyUp({ code }); },
  tap(code) { onKeyDown({ code, repeat: false, preventDefault() {} }); onKeyUp({ code }); },
  probe(seed, dname) {
    const tr = genTrack(seed, dname);
    let maxSlope = 0, minHalf = 1e9, maxHalf = 0, mono = true, maxGap = 0;
    for (let i = 0; i < tr.pts.length; i++) {
      if (i > 0) {
        const dy = tr.pts[i].y - tr.pts[i - 1].y;
        if (dy >= 0) mono = false;
        const dx = Math.abs(tr.pts[i].x - tr.pts[i - 1].x);
        maxSlope = Math.max(maxSlope, dx / tr.seg);
        maxGap = Math.max(maxGap, Math.hypot(dx, dy));
      }
      minHalf = Math.min(minHalf, tr.half[i]);
      maxHalf = Math.max(maxHalf, tr.half[i]);
    }
    return {
      total: tr.total, n: tr.pts.length, maxSlope, minHalf, maxHalf, mono, maxGap,
      cows: tr.cows.length, cans: tr.cans.length, haz: tr.haz.length,
      rocks: tr.zones.filter((z) => z.kind === 'rock').length
    };
  }
};
})();
</script>
