<title>停車場小管理員</title>
<style>
html, body {
  width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
  overscroll-behavior: none; background: #2b323b;
  font-family: "PingFang HK", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}
#stage { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
#cv {
  display: block; touch-action: none; user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
#rotate { display: none; position: fixed; inset: 0; background: #2b323b; align-items: center; justify-content: center; }
#rotate i {
  display: block; width: 90px; height: 150px; border: 8px solid #fff; border-radius: 18px;
  animation: turn 2s ease-in-out infinite;
}
@keyframes turn { 0%, 20% { transform: rotate(0); } 60%, 100% { transform: rotate(90deg); } }
body.portrait #rotate { display: flex; }
#parent {
  position: fixed; inset: 0; background: rgba(30, 36, 44, .6);
  display: flex; align-items: center; justify-content: center;
}
#parent[hidden] { display: none; }
#parent .box {
  background: #fff; border-radius: 20px; padding: 20px 26px; max-width: 640px; width: 86%;
  max-height: 86%; overflow: auto; color: #2b323b;
}
#parent h2 { margin: 0 0 6px; }
#parent p { margin: 0 0 12px; font-size: 14px; color: #5b6470; }
#parent table { width: 100%; border-collapse: collapse; font-size: 15px; }
#parent th, #parent td { padding: 6px 8px; border-bottom: 1px solid #e3e6ea; text-align: left; }
#parent button {
  margin-top: 14px; padding: 10px 26px; border: 0; border-radius: 12px;
  background: #00a59b; color: #fff; font-size: 16px; font-weight: 700;
}

</style>

// 纯逻辑：不碰 DOM / canvas / 音频，Node 里可以直接跑（见 parking-lot.test.js）。
// 照着星星那张停车场地垫：每行车位一个字母（A–E），每个位一个号码（1–8）。
// 前三关「睇飛泊車」：一架车开到入口，揸住一张泊车飞，拖（或者撳）去飞上嘅车位；
// 第四关「出閘畀錢」：按价钱一个一个放银仔，再自己撳開閘。
const ParkModel = (() => {
  const LETTERS = ['A', 'B', 'C', 'D', 'E'];
  // 车仔收藏：头两款一开始就有，之后每过一关拿一款
  const LIVERIES = ['#e2463a', '#f2b632', '#2a7fd4', '#2f8f5b', '#f07c2a', '#8a5bc4', '#ff8fb8', '#ffd24a'];
  const START_GARAGE = 2, MAX_SKILL = 2;
  // 已经泊喺度嘅「别人嘅车」：白 / 银 / 黑，同玩家嘅彩色车分得开
  const OTHERS = ['#f4f4f2', '#b8bec6', '#3c434c'];
  const T = {
    enter: 1.4, park: 1.0, back: 0.6, leave: 1.8,
    lock: 0.7,          // 点错之后锁一下：乱点一轮撞不中正确答案
    hint: 7,            // 多久冇动静就提示
    hintRepeat: 8,
    introGuard: 0.8,
    nextCar: 0.5
  };
  // rows / spots / cars / price 按 skill（0–2）取；colors = 每行有自己的颜色帮手；dots = 飞上号码下面画圆点；
  // read = 车到时读出张飞（第三关唔读，要自己睇）
  const LEVELS = [
    { key: 'num', rows: [1, 1, 1], spots: [6, 8, 8], parked: [1, 2, 3], cars: 4, colors: true, dots: [true, true, false], read: true },
    { key: 'zone', rows: [2, 3, 3], spots: [5, 6, 8], parked: [2, 4, 6], cars: 5, colors: true, dots: [true, false, false], read: true },
    { key: 'read', rows: [3, 4, 5], spots: [6, 6, 8], parked: [4, 6, 10], cars: 5, colors: false, dots: [false, false, false], read: false },
    { key: 'pay', price: [3, 4, 5], cars: 5, dots: [true, false, false] }
  ];
  const need = cars => cars - 1;   // 过关：最多错一架

  // 共用状态机（shared/knowledge-gate.js）。浏览器里它由 build 内联成另一个 <script>，
  // 而且排喺 model.js 之后，所以呢度一定要懒解析：加载期嗌 require 会即场 ReferenceError。
  // Node 跑测试时就 require 返同一个实现（注意是 ../../ —— src/model.js 的 __dirname 是 games/parking-lot/src）。
  let KGLIB = null;
  const KG = () => KGLIB || (KGLIB = (typeof KnowledgeGate !== 'undefined') ? KnowledgeGate
    : require('../../shared/knowledge-gate.js'));

  // 关卡全开：只要下标合法就入得去（已经冇「通关先解锁」）
  const canSelect = i => Number.isInteger(i) && i >= 0 && i < LEVELS.length;

  // ───────── 知识闸（每关出口一道题：答对才放行）─────────
  // 15 个知识点（产品 §4.4）。键 = 存档 m.kb 里的 kpId；
  // 值 = env => ({ q: [语音 key…], choices: [{label, kind, num / letter, voice}], right })。
  // env 由 create() 注入：{ m, rng, shuffle, kp, now }——kp 是这一次考的 id（出题要知道自己考边个字母 / 号码）。
  // 干扰项一定要同族：号码取相邻（2 / 3 / 4 咁），字母取同一批 A–E，靠颜色或者位置蒙唔中。
  const NUMS = [1, 2, 3, 4, 5, 6, 7, 8];
  function nearNums(n, shuffle, take) {
    let pool = NUMS.filter(x => x !== n && Math.abs(x - n) <= 2);
    // 1 / 8 得一边有邻居，唔够数先向外补（正常情况一律用相邻号码）
    if (pool.length < take) pool = pool.concat(NUMS.filter(x => x !== n && pool.indexOf(x) < 0));
    return shuffle(pool).slice(0, take);
  }
  // L1：车位图（号码 + 圆点）—— 听「三號」揾 3 号位
  function spotQ(env) {
    const n = 2 + Math.floor(env.rng() * 6);                     // 2–7：两边都有邻居，干扰项贴住放
    const pack = [n].concat(nearNums(n, env.shuffle, 2));
    const choices = env.shuffle(pack).map(x => ({ label: String(x), kind: 'spot', num: x, voice: 'n' + x }));
    return { q: ['hint_ticket', 'n' + n], choices, right: choices.findIndex(c => c.num === n) };
  }
  // L2：一行车位图（同一个号码、不同字母）
  function letterQ(env, letter) {
    const n = 1 + Math.floor(env.rng() * 6);
    const pack = [letter].concat(env.shuffle(LETTERS.filter(x => x !== letter)).slice(0, 2));
    const choices = env.shuffle(pack).map(x => ({ label: x + n, kind: 'row', letter: x, num: n, voice: 'z_' + x }));
    return { q: ['gate_q_letter', 'z_' + letter, 'n' + n], choices, right: choices.findIndex(c => c.letter === letter) };
  }
  // L3：纯数字牌（冇圆点、冇颜色）
  function numQ(env, n) {
    const pack = [n].concat(nearNums(n, env.shuffle, 2));
    const choices = env.shuffle(pack).map(x => ({ label: String(x), kind: 'num', num: x, voice: 'n' + x }));
    return { q: ['gate_q_num', 'n' + n], choices, right: choices.findIndex(c => c.num === n) };
  }
  // L4：一堆银仔（数量 = 收费亭显示嘅价钱，干扰项只差数量，同画面唔会对唔上）
  function moneyQ(env) {
    const shown = Number(env.m && env.m.price);
    const n = (shown >= 1 && shown <= 5) ? shown : 2 + Math.floor(env.rng() * 3);
    const near = [n - 1, n + 1, n + 2].filter(x => x >= 1 && x <= 6);
    const pack = [n].concat(env.shuffle(near).slice(0, 2));
    const choices = env.shuffle(pack).map(x => ({ label: String(x), kind: 'coins', num: x, voice: 'c' + x }));
    return { q: ['p' + n], choices, right: choices.findIndex(c => c.num === n) };
  }
  const KPS = { 'pl.dot.count': spotQ, 'pl.money.count': moneyQ };
  LETTERS.forEach(L => { KPS['pl.letter.' + L] = env => letterQ(env, L); });
  NUMS.forEach(n => { KPS['pl.num.' + n] = env => numQ(env, n); });
  // 每关出口考边一族（键 = LEVELS[level].key）；同一族里按 R2 挑一个（答错过的先补考，同一日唔连考）
  const LEVEL_KPS = {
    num: ['pl.dot.count'],
    zone: LETTERS.map(L => 'pl.letter.' + L),
    read: NUMS.map(n => 'pl.num.' + n),
    pay: ['pl.money.count']
  };

  function create(rng) {
    rng = rng || Math.random;
    const m = {
      phase: 'splash', level: 0, t: 0, time: 0, k: 0, cars: 0,
      rows: [], spots: [], car: null, prevNum: 0, stars: [], carBad: false, lock: 0,
      idle: 0, hintN: 0, glow: -1, price: 0, coins: 0, dots: false, colors: true,
      mistakes: { zone: 0, num: 0, pay: 0 }, passed: false,
      unlocked: 0, best: LEVELS.map(() => 0), skill: LEVELS.map(() => 0), stats: {},
      garage: START_GARAGE, newCar: -1, goodN: 0, events: [], gateLog: null
    };
    const emit = (t, name, data) => m.events.push({ t, name, data });
    const say = (...names) => emit('voice', names.length > 1 ? names : names[0]);
    const pick = arr => arr[Math.floor(rng() * arr.length)];
    const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
    const lv = () => LEVELS[m.level];
    const sk = () => m.skill[m.level];
    // 知识闸的状态机（shared/knowledge-gate.js）：一个 model 实例一个，掌握度跨关累积。
    // 内部字段叫 kg —— 本款已经有 openGate() / insertCoin()（出闸畀钱），千万唔好叫 m.gate。
    // now 交给状态机记 lastTs（R2 轮转补考 / 同一日唔连考都靠佢）。
    const env = { m, rng, shuffle, kp: '', now: () => Date.now() };
    const kg = KG().create({ kps: KPS, emit, env });
    m.kg = kg;

    // 家长记录：每个字母 / 号码 / 价钱 认啱几多次、认错几多次
    function stat(key, ok) {
      const s = m.stats[key] || (m.stats[key] = [0, 0]);
      s[ok ? 0 : 1]++;
    }
    function oops() {
      m.carBad = true; m.lock = T.lock; m.idle = 0;
      emit('sfx', 'buzz');
    }
    function good() {
      say('good' + (1 + (m.goodN++ % 3)));
    }

    function buildLot() {
      const L = lv(), s = sk();
      const nRows = L.rows[s], nSpots = L.spots[s];
      m.rows = LETTERS.slice(0, nRows);
      m.spots = [];
      m.rows.forEach((letter, r) => { for (let n = 1; n <= nSpots; n++) m.spots.push({ r, n, occ: null }); });
      shuffle(m.spots.map((_, i) => i)).slice(0, L.parked[s]).forEach(i => { m.spots[i].occ = { color: pick(OTHERS), mine: false }; });
      m.colors = L.colors; m.dots = L.dots[s];
    }

    // 下一张飞：空位里面揀；号码唔同上一架（唔会连续两张一样），
    // 有几行时优先揀「别行都有同号空位」嘅位——要真系睇字母先揀得啱
    function nextTarget() {
      const free = m.spots.map((s, i) => i).filter(i => !m.spots[i].occ);
      let pool = free.filter(i => m.spots[i].n !== m.prevNum);
      if (!pool.length) pool = free;
      if (m.rows.length > 1) {
        const twin = pool.filter(i => free.some(j => j !== i && m.spots[j].n === m.spots[i].n));
        if (twin.length) pool = twin;
      }
      return pick(pool);
    }

    function newCar() {
      m.k++;
      m.carBad = false; m.idle = 0; m.hintN = 0; m.glow = -1; m.coins = 0;
      const color = LIVERIES[Math.floor(rng() * m.garage)];
      if (lv().key === 'pay') {
        const max = lv().price[sk()];
        let p;
        do { p = 1 + Math.floor(rng() * max); } while (p === m.price && max > 1);
        m.price = p;
        m.car = { color, state: 'enter', t: 0 };
      } else {
        const target = nextTarget();
        m.prevNum = m.spots[target].n;
        m.car = { color, target, state: 'enter', t: 0, spot: -1 };
      }
      emit('sfx', 'engine');
    }

    function ticketVoice() {
      if (lv().key === 'pay') return ['p' + m.price];
      const s = m.spots[m.car.target];
      return m.rows.length > 1 ? ['z_' + m.rows[s.r], 'n' + s.n] : ['n' + s.n];
    }

    function startLevel(i) {
      m.level = i; m.k = 0; m.stars = []; m.prevNum = 0; m.price = 0;
      m.mistakes = { zone: 0, num: 0, pay: 0 }; m.gateLog = null;
      m.cars = lv().cars;
      if (lv().key === 'pay') { m.rows = []; m.spots = []; m.dots = lv().dots[sk()]; }
      else buildLot();
      m.phase = 'intro'; m.t = 0;
      say('l' + (i + 1) + '_intro');
    }

    function finishCar() {
      m.stars.push(!m.carBad);
      if (m.k >= m.cars) return finishLevel();
      m.phase = 'gap'; m.t = 0;
    }

    function finishLevel() {
      const got = m.stars.filter(Boolean).length;
      m.passed = got >= need(m.cars);
      m.best[m.level] = Math.max(m.best[m.level], got);
      const bad = m.stars.length - got;
      // 难度自动调：成关冇错就升，错三架以上就降
      if (bad === 0) m.skill[m.level] = Math.min(MAX_SKILL, m.skill[m.level] + 1);
      else if (bad >= 3) m.skill[m.level] = Math.max(0, m.skill[m.level] - 1);
      m.newCar = -1;
      if (m.passed && m.garage < LIVERIES.length) { m.newCar = m.garage; m.garage++; }
      // 过关先出闸：答对先放行（唔会扣分），闸过咗先入 levelDone
      if (m.passed && startGate()) return;
      endLevel();
    }

    // 原本 finishLevel 收尾嗰段：闸门过咗之后照旧行呢度（烟花、新车、done 语音一样唔变）
    function endLevel() {
      m.phase = 'levelDone'; m.t = 0;
      emit('sfx', m.passed ? 'fanfare' : 'soft');
      const last = m.passed && m.level === LEVELS.length - 1;
      say(m.passed ? (last ? 'finale' : 'done') : 'retry');
      emit('log', null, {
        level: m.level, stars: m.stars.filter(Boolean).length, cars: m.cars, zone: m.mistakes.zone,
        num: m.mistakes.num, pay: m.mistakes.pay, skill: m.skill[m.level], gate: m.gateLog
      });
    }

    // 开闸门：kpId 由本关（LEVELS[level].key）决定族，族里面按 R2 挑一个
    function startGate() {
      const kpId = kg.pick(LEVEL_KPS[lv().key] || [], Date.now());
      if (!kpId) return false;                       // 冇题库就照旧直接走，唔因为加闸卡死
      env.kp = kpId;
      if (!kg.start(kpId, { level: m.level })) return false;
      m.gateLog = { kp: kpId, attempts: 0, byRescue: false };
      m.phase = 'gate'; m.t = 0; m.lock = 0; m.idle = 0;
      return true;
    }

    // 闸内答错：只晃卡 + buzz。绝唔可以叫 oops()——嗰个会设 carBad 扣星（「冇输、冇扣分」）。
    function gateOops() { m.lock = T.lock; emit('sfx', 'buzz'); m.idle = 0; }

    function answerGate(i) {
      if (m.phase !== 'gate' || m.lock > 0) return null;   // 沿用 m.lock 挡乱拍，唔累加 attempts
      const r = kg.answer(i);
      if (r === 'teach') gateOops();
      else if (r === 'nudge') m.lock = T.lock;
      if (r) {
        const st = kg.state();
        m.gateLog = { kp: st.kp, attempts: st.attempts, byRescue: st.byRescue };
      }
      return r;
    }

    const api = {
      m, LEVELS, LIVERIES,
      advance() {
        if (m.phase === 'splash') { m.phase = 'title'; m.t = 0; say('hello'); return true; }
        if (m.phase === 'gate') {
          // 闸未开：空格 / 回车唔会替佢答题；闸开咗（紧接嗰 0.6 秒）就即刻收尾
          if (!kg.state().opened) return false;
          endLevel();
          return true;
        }
        if (m.phase === 'intro' && m.t >= T.introGuard) { newCar(); m.phase = 'play'; m.t = 0; return true; }
        return false;
      },
      selectLevel(i) {
        if (m.phase !== 'title' || !canSelect(i)) return false;
        startLevel(i);
        return true;
      },
      // 车位选择（拖放到某个位、或者直接撳个位都行）。返回 'ok' / 'zone' / 'num' / 'taken' / null
      choose(i) {
        if (m.phase !== 'play' || !m.car || m.car.state !== 'wait' || m.lock > 0) return null;
        const s = m.spots[i];
        if (!s) return null;
        if (s.occ) { say('taken'); emit('sfx', 'buzz'); m.lock = T.lock; m.car.state = 'back'; m.car.t = 0; return 'taken'; }
        const want = m.spots[m.car.target];
        const multi = m.rows.length > 1;
        if (i === m.car.target) {
          if (multi) stat('L_' + m.rows[want.r], true);
          stat('N_' + want.n, true);
          m.car.state = 'park'; m.car.t = 0; m.car.spot = i;
          s.occ = { color: m.car.color, mine: true };
          m.glow = -1;
          emit('sfx', 'beep');
          return 'ok';
        }
        // 号码啱、行唔啱 = 字母认错；否则算号码认错（行啱唔啱都好，先睇号码）
        let kind;
        if (multi && s.n === want.n) { kind = 'zone'; stat('L_' + m.rows[want.r], false); }
        else { kind = 'num'; stat('N_' + want.n, false); }
        m.mistakes[kind]++;
        oops();
        say(kind === 'zone' ? 'wrong_zone' : 'wrong_num');
        m.car.state = 'back'; m.car.t = 0;
        return kind;
      },
      // 出闸：放一个银仔（数住讲「一、二、三」）
      insertCoin() {
        if (m.phase !== 'play' || !m.car || m.car.state !== 'wait' || m.lock > 0 || m.coins >= 6) return false;
        m.coins++; m.idle = 0;
        emit('sfx', 'coin');
        say('c' + m.coins);
        return true;
      },
      takeCoin() {
        if (m.phase !== 'play' || !m.car || m.car.state !== 'wait' || m.lock > 0 || m.coins <= 0) return false;
        m.coins--; m.idle = 0;
        emit('sfx', 'tap');
        return true;
      },
      // 唔会放够就自动开闸：要自己判断够唔够再撳，练「数完先做」
      openGate() {
        if (m.phase !== 'play' || !m.car || m.car.state !== 'wait' || m.lock > 0) return null;
        if (m.coins === 0) { say('pay_empty'); emit('sfx', 'buzz'); m.lock = T.lock; return 'empty'; }
        if (m.coins === m.price) {
          stat('P_' + m.price, true);
          m.car.state = 'leave'; m.car.t = 0;
          emit('sfx', 'gate');
          say('gate_open');
          return 'ok';
        }
        stat('P_' + m.price, false);
        m.mistakes.pay++;
        oops();
        m.coins = 0;
        say('pay_wrong');
        return 'wrong';
      },
      // 拖车时：车喺唔喺等紧（shell 用来决定拖唔拖得）
      carReady() { return m.phase === 'play' && !!m.car && m.car.state === 'wait' && m.lock <= 0; },
      repeatTicket() {
        if (m.phase !== 'play' || !m.car || m.car.state !== 'wait') return false;
        say(...ticketVoice());
        return true;
      },
      home() {
        if (m.phase === 'splash') return false;
        // 闸内回主页 / 按 Esc：题当冇发生过（kg.abort() 只回滚 seen，不算答错、唔会漏放行）
        if (m.phase === 'gate') kg.abort();
        m.phase = 'title'; m.t = 0; m.car = null; say(null);
        return true;
      },
      next() {
        // 关卡全开：过唔过关都可以去下一关（关卡卡已经冇锁）
        if (m.phase !== 'levelDone' || m.level >= LEVELS.length - 1) return false;
        startLevel(m.level + 1);
        return true;
      },
      replay() {
        if (m.phase !== 'levelDone') return false;
        startLevel(m.level);
        return true;
      },
      openGarage() {
        if (m.phase !== 'title') return false;
        m.phase = 'garage'; m.t = 0;
        return true;
      },
      update(dt) {
        m.t += dt; m.time += dt;
        if (m.lock > 0) m.lock = Math.max(0, m.lock - dt);
        // 闸门：答对 + 停 0.6 秒才放行（呢句要放喺 play 守卫之前，唔系永远唔会行）
        if (m.phase === 'gate') { if (kg.tick(dt) === 'open') endLevel(); return; }
        if (m.phase === 'gap' && m.t >= T.nextCar) { newCar(); m.phase = 'play'; m.t = 0; return; }
        if (m.phase !== 'play' || !m.car) return;
        const c = m.car;
        c.t += dt;
        if (c.state === 'enter' && c.t >= T.enter) {
          c.state = 'wait'; c.t = 0; m.idle = 0;
          // 第三关唔读飞：要自己睇
          if (lv().key === 'pay' || lv().read) say(...ticketVoice());
          else emit('sfx', 'ding');
        } else if (c.state === 'back' && c.t >= T.back) {
          c.state = 'wait'; c.t = 0;
        } else if (c.state === 'park' && c.t >= T.park) {
          if (!m.carBad) good();
          finishCar();
        } else if (c.state === 'leave' && c.t >= T.leave) {
          if (!m.carBad) good();
          finishCar();
        } else if (c.state === 'wait' && m.lock <= 0) {
          m.idle += dt;
          const due = m.hintN === 0 ? T.hint : T.hintRepeat;
          if (m.idle >= due) {
            m.idle = 0; m.hintN++;
            if (lv().key === 'pay') say(...ticketVoice());
            // 第一次提示读张飞；之后连目标车位都闪埋（呢架车算错咗，唔畀星）
            else if (m.hintN === 1) say('hint_ticket', ...ticketVoice());
            else { m.glow = c.target; m.carBad = true; say('hint_glow'); }
          }
        }
      },
      snapshot() {
        // kb 是加法字段：v 保持 1（升版 = 星星同车仔当场清零），unlocked 保留但只读
        return {
          v: 1, unlocked: m.unlocked, best: m.best.slice(), skill: m.skill.slice(), stats: m.stats,
          garage: m.garage, muted: !!m.muted, kb: kg.dump()
        };
      },
      restore(s) {
        if (!s || s.v !== 1) return;
        const n = LEVELS.length;
        const okArr = a => Array.isArray(a) && a.length === n && a.every(x => Number.isInteger(x) && x >= 0);
        if (Number.isInteger(s.unlocked)) m.unlocked = Math.max(0, Math.min(n - 1, s.unlocked));
        if (okArr(s.best)) m.best = s.best.slice();
        if (okArr(s.skill)) m.skill = s.skill.map(x => Math.min(MAX_SKILL, x));
        if (s.stats && typeof s.stats === 'object') m.stats = s.stats;
        if (Number.isInteger(s.garage)) m.garage = Math.max(START_GARAGE, Math.min(LIVERIES.length, s.garage));
        kg.load(s.kb);              // 旧存档冇 kb → 空对象（天然迁移），未知 kp / 坏值由 clampKb 夹掉
      },
      // 统一知识闸 API（四款一字不差）：gate() / gateAnswer(i) / gateState() / mastery()
      // 相位守卫（照 metro 的写法）：共用闸的 cur 要等下一题 start() 才清，答对放行后 view() 还是旧那份，
      // 所以不是 gate 相位一律回 null，免得外部脚本信 `gate() !== null` 误判还在闸里。
      gate: () => (m.phase === 'gate' ? kg.view() : null),
      gateAnswer: answerGate,
      gateState: () => kg.state(),
      mastery: () => kg.state().mastery          // { kpId: [自己答对次数, 认错次数] }
    };
    return api;
  }

  return {
    create, LEVELS, LIVERIES, LETTERS, T, need, KPS, LEVEL_KPS, canSelect,
    STAGES: () => KG().STAGES, mastered: rec => KG().mastered(rec)
  };
})();
if (typeof module === 'object' && module.exports) module.exports = ParkModel;

<script>
'use strict';
// 音效全部 Web Audio 合成（与雙層巴士同一套）；人声是内联的 mp3，解码后也走同一个 AudioContext——
// iOS 上只要第一次触摸解锁过 context，之后人声就不用每句都等手势。
const ParkAudio = (() => {
  let ctx = null, master = null, muted = false, voiceNode = null, pending = null;
  const buffers = {};

  function unlock() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = muted ? 0 : 1;
      master.connect(ctx.destination);
      Object.keys(ASSETS.voice).forEach(name => {
        const bin = atob(ASSETS.voice[name]);
        const buf = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
        ctx.decodeAudioData(buf.buffer, b => {
          buffers[name] = b;
          // 第一下触摸既解锁音频又触发第一句话，那时还没解码完——解码好了补播
          if (pending === name) { seq.unshift(name); playNext(); }
        }, () => {});
      });
    } catch (e) { ctx = null; }
  }

  function setMuted(v) {
    muted = v;
    if (master) master.gain.value = v ? 0 : 1;
  }

  function tone(type, f0, f1, at, dur, vol) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    const t = ctx.currentTime + at;
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }

  function noise(at, dur, freq, vol) {
    const n = Math.floor(ctx.sampleRate * dur);
    const b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    const t = ctx.currentTime + at;
    s.buffer = b; f.type = 'lowpass'; f.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + dur * 0.4);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t);
  }

  const SFX = {
    engine() { noise(0, 1.3, 380, 0.2); tone('sawtooth', 70, 110, 0, 1.1, 0.05); },
    beep() { tone('square', 880, 880, 0, 0.09, 0.08); tone('square', 880, 880, 0.16, 0.09, 0.08); },
    // 点错的提示要软：是「再睇吓」，不是「你错了」
    buzz() { tone('triangle', 240, 200, 0, 0.14, 0.2); tone('triangle', 200, 170, 0.17, 0.18, 0.2); },
    coin() { tone('sine', 1320, 1320, 0, 0.08, 0.16); tone('sine', 1760, 1760, 0.06, 0.18, 0.14); },
    gate() { tone('sine', 523, 784, 0, 0.35, 0.16); noise(0.1, 0.5, 900, 0.08); },
    ding() { tone('sine', 1047, 1047, 0, 0.35, 0.16); },
    fanfare() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone('triangle', f, f, i * 0.13, 0.3, 0.18)); },
    soft() { tone('sine', 660, 660, 0, 0.3, 0.15); tone('sine', 523, 523, 0.2, 0.4, 0.15); },
    tap() { tone('sine', 700, 500, 0, 0.06, 0.1); }
  };

  function sfx(name) {
    if (!ctx || !SFX[name]) return;
    try { SFX[name](); } catch (e) { /* 没声音也能玩 */ }
  }

  // 同一时间只说一句：新的一句（或一串）打断旧的。name 为空 = 只是让它闭嘴。
  // 传数组 = 接着说，例如「B 行，」+「三號」
  let seq = [];
  function voice(name) {
    if (!ctx) return;
    seq = Array.isArray(name) ? name.slice() : [name];
    playNext();
  }
  function playNext() {
    if (voiceNode) { const n = voiceNode; voiceNode = null; n.onended = null; try { n.stop(); } catch (e) { /* 已经播完 */ } }
    const name = seq.shift();
    const b = name && buffers[name];
    pending = b ? null : name;
    if (!b) return;
    const s = ctx.createBufferSource(), g = ctx.createGain();
    s.buffer = b; g.gain.value = 1.5;
    s.connect(g); g.connect(master);
    s.onended = () => { if (voiceNode === s) { voiceNode = null; if (seq.length) playNext(); } };
    s.start();
    voiceNode = s;
  }

  function pause(v) { if (ctx) (v ? ctx.suspend() : ctx.resume()); }

  return { unlock, setMuted, sfx, voice, pause, isMuted: () => muted };
})();

</script>
<script>
'use strict';
// 画面：逻辑坐标固定 960×540，shell 负责缩放。命中区域也放在这里（Layout），画的和点的用同一份数。
const Layout = {
  W: 960, H: 540,
  lot: { x: 24, y: 78, w: 676, h: 446 },
  ticket: { x: 826, y: 196, w: 196, h: 168 },
  gateCar: { x: 826, y: 430 },     // 入口：车喺度等
  home: { x: 40, y: 40, r: 24 },
  mute: { x: 920, y: 40, r: 24 },
  bear: { x: 150, y: 110, r: 56 },
  splashPlay: { x: 480, y: 340, r: 84 },
  tiles: [0, 1, 2, 3].map(i => ({ x: 50 + i * 223, y: 196, w: 190, h: 256 })),
  garage: { x: 880, y: 110, r: 40 },
  replay: (hasNext) => ({ x: hasNext ? 390 : 480, y: 400, r: 42 }),
  next: { x: 580, y: 400, r: 48 },
  // 出闸关
  booth: { x: 480, y: 150 },
  tray: [0, 1, 2, 3, 4, 5].map(i => ({ x: 150 + i * 92, y: 474, r: 36 })),
  slotRow: { x: 330, y: 268, w: 300, h: 56 },
  gateBtn: { x: 836, y: 456, r: 60 },
  roadY: 384
};
// 车位格：按行数 / 每行几个位动态排
Layout.grid = (nRows, nSpots) => {
  const L = Layout.lot, gap = 18;
  const rowH = Math.min(120, (L.h - gap * (nRows - 1)) / nRows);
  const top = L.y + (L.h - (rowH * nRows + gap * (nRows - 1))) / 2;
  const left = L.x + 70, spotW = Math.min(92, (L.w - 80) / nSpots);
  return { rowH, top, left, spotW, gap, rowY: r => top + r * (rowH + gap) };
};
Layout.spotRect = (m, i) => {
  const s = m.spots[i], g = Layout.grid(m.rows.length, m.spots.filter(x => x.r === 0).length);
  return { x: g.left + (s.n - 1) * g.spotW, y: g.rowY(s.r), w: g.spotW, h: g.rowH };
};
// 知识闸的选项卡：3 张 ≥180、2 张放大并排 ≥240、只剩 1 张更大（脉冲发光）。
// 画的和点的都用这一份，所以 shell 照住同一个函数拿命中区。
Layout.gateCards = n => {
  const s = n >= 3 ? 184 : n === 2 ? 260 : 300;
  const gap = n >= 3 ? 44 : 60;
  const total = n * s + Math.max(0, n - 1) * gap;
  const x0 = (Layout.W - total) / 2, cy = 318;
  const out = [];
  for (let i = 0; i < n; i++) out.push({ x: x0 + i * (s + gap), y: cy - s / 2, w: s, h: s });
  return out;
};

const ParkRender = (() => {
  const L = Layout;
  const FONT = '"PingFang HK","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif';
  const LEVEL_NAME = ['對號泊車', '搵行泊車', '淨係睇飛', '出閘畀錢'];
  const LEVEL_SUB = ['睇號碼數圓點', '字母 + 號碼', '冇顏色幫手', '數銀仔開閘'];
  const TILE_BAND = ['#2a7fd4', '#2f8f5b', '#8a5bc4', '#e8590c'];
  // 每行嘅颜色帮手（第一、二关）；第三关全部灰
  const ROW_COLOR = ['#e2463a', '#2a7fd4', '#f2b632', '#2f8f5b', '#8a5bc4'];
  const imgs = {};

  function load() {
    Object.keys(ASSETS.img).forEach(k => { const im = new Image(); im.src = ASSETS.img[k]; imgs[k] = im; });
  }

  const easeOut = p => 1 - Math.pow(1 - p, 3);
  const easeInOut = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  const clamp01 = v => Math.max(0, Math.min(1, v));
  const lerp = (a, b, p) => a + (b - a) * p;

  function rr(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }
  function star(c, x, y, r, fill, stroke) {
    c.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * 0.46 : r;
      c.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q);
    }
    c.closePath();
    if (fill) { c.fillStyle = fill; c.fill(); }
    if (stroke) { c.lineWidth = 3; c.strokeStyle = stroke; c.lineJoin = 'round'; c.stroke(); }
  }
  function text(c, s, x, y, size, color, align, weight) {
    c.font = (weight || 800) + ' ' + size + 'px ' + FONT;
    c.textAlign = align || 'center'; c.textBaseline = 'middle';
    c.fillStyle = color; c.fillText(s, x, y);
  }
  function roundBtn(c, b, color, pulse) {
    const r = b.r * (1 + (pulse || 0));
    c.beginPath(); c.arc(b.x, b.y + 4, r, 0, Math.PI * 2); c.fillStyle = 'rgba(0,0,0,.18)'; c.fill();
    c.beginPath(); c.arc(b.x, b.y, r, 0, Math.PI * 2); c.fillStyle = color; c.fill();
    c.lineWidth = 4; c.strokeStyle = '#fff'; c.stroke();
    return r;
  }
  function playIcon(c, x, y, s) {
    c.beginPath(); c.moveTo(x - s * 0.38, y - s * 0.55); c.lineTo(x + s * 0.62, y); c.lineTo(x - s * 0.38, y + s * 0.55);
    c.closePath(); c.fillStyle = '#fff'; c.fill();
  }
  function homeBtn(c) {
    roundBtn(c, L.home, '#5b6470');
    c.fillStyle = '#fff';
    c.beginPath(); c.moveTo(L.home.x, L.home.y - 13); c.lineTo(L.home.x + 14, L.home.y); c.lineTo(L.home.x - 14, L.home.y); c.closePath(); c.fill();
    c.fillRect(L.home.x - 9, L.home.y, 18, 11);
  }
  function mute(c, g) {
    const b = L.mute;
    roundBtn(c, b, '#5b6470');
    c.fillStyle = '#fff';
    c.beginPath(); c.moveTo(b.x - 13, b.y - 5); c.lineTo(b.x - 6, b.y - 5); c.lineTo(b.x + 2, b.y - 12);
    c.lineTo(b.x + 2, b.y + 12); c.lineTo(b.x - 6, b.y + 5); c.lineTo(b.x - 13, b.y + 5); c.closePath(); c.fill();
    c.strokeStyle = '#fff'; c.lineWidth = 3; c.lineCap = 'round';
    if (g.muted) { c.beginPath(); c.moveTo(b.x + 6, b.y - 6); c.lineTo(b.x + 14, b.y + 6); c.moveTo(b.x + 14, b.y - 6); c.lineTo(b.x + 6, b.y + 6); c.stroke(); }
    else { c.beginPath(); c.arc(b.x + 3, b.y, 9, -0.8, 0.8); c.stroke(); }
  }
  function bear(c, x, y, r) {
    const im = imgs.bear;
    c.save();
    c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fillStyle = '#fff'; c.fill();
    if (im && im.complete && im.naturalWidth) { c.clip(); c.drawImage(im, x - r, y - r, r * 2, r * 2); }
    c.restore();
    c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.lineWidth = 4; c.strokeStyle = '#fff'; c.stroke();
  }

  // 俯视小车：车头朝 angle 方向（0 = 向右）。len = 车长
  function car(c, x, y, color, angle, len, opt) {
    const w = len * 0.56, l = len;
    c.save();
    c.translate(x, y); c.rotate(angle);
    if (!(opt && opt.noShadow)) { rr(c, -l / 2 + 3, -w / 2 + 5, l, w, w * 0.32); c.fillStyle = 'rgba(0,0,0,.22)'; c.fill(); }
    // 车轮
    c.fillStyle = '#1d2228';
    [[-l * 0.3, -w / 2 - 2], [l * 0.22, -w / 2 - 2], [-l * 0.3, w / 2 - 4], [l * 0.22, w / 2 - 4]].forEach(([wx, wy]) => {
      rr(c, wx, wy, l * 0.16, 6, 2); c.fill();
    });
    rr(c, -l / 2, -w / 2, l, w, w * 0.32);
    c.fillStyle = color; c.fill();
    c.lineWidth = 2; c.strokeStyle = 'rgba(0,0,0,.25)'; c.stroke();
    // 挡风玻璃（前）+ 后窗
    c.fillStyle = 'rgba(40,60,80,.85)';
    rr(c, l * 0.1, -w * 0.36, l * 0.17, w * 0.72, 4); c.fill();
    rr(c, -l * 0.36, -w * 0.32, l * 0.12, w * 0.64, 4); c.fill();
    // 车顶高光
    c.fillStyle = 'rgba(255,255,255,.28)';
    rr(c, -l * 0.2, -w * 0.3, l * 0.28, w * 0.6, 5); c.fill();
    // 车头灯
    c.fillStyle = '#fff7c2';
    c.beginPath(); c.arc(l / 2 - 4, -w * 0.3, 3, 0, Math.PI * 2); c.arc(l / 2 - 4, w * 0.3, 3, 0, Math.PI * 2); c.fill();
    c.restore();
  }

  function asphalt(c, x, y, w, h) {
    c.fillStyle = '#3a4350'; c.fillRect(x, y, w, h);
  }

  // ───────── 停车场 ─────────
  function lot(c, g) {
    const m = g.m;
    asphalt(c, 0, 0, L.W, L.H);
    const nSpots = m.spots.filter(s => s.r === 0).length;
    const gr = L.grid(m.rows.length, nSpots);
    // 入口车道（右边）
    c.fillStyle = '#323a45'; c.fillRect(712, 0, 248, L.H);
    c.setLineDash([18, 14]); c.strokeStyle = '#e8c547'; c.lineWidth = 4;
    c.beginPath(); c.moveTo(712, 70); c.lineTo(712, L.H); c.stroke(); c.setLineDash([]);
    m.rows.forEach((letter, r) => {
      const y = gr.rowY(r), col = m.colors ? ROW_COLOR[r] : '#9aa3ad';
      // 行底色（颜色帮手）
      if (m.colors && m.rows.length > 1) { c.fillStyle = col + '2e'; c.fillRect(gr.left, y, gr.spotW * nSpots, gr.rowH); }
      // 字母牌
      const br = Math.min(28, gr.rowH * 0.36);
      c.beginPath(); c.arc(gr.left - 36, y + gr.rowH / 2, br, 0, Math.PI * 2);
      c.fillStyle = m.colors ? col : '#f4f4f2'; c.fill();
      c.lineWidth = 3; c.strokeStyle = '#fff'; c.stroke();
      text(c, letter, gr.left - 36, y + gr.rowH / 2 + 1, br * 1.3, m.colors ? '#fff' : '#2b323b');
      // 车位白线
      c.strokeStyle = '#f1f3f5'; c.lineWidth = 3;
      for (let n = 0; n <= nSpots; n++) {
        const x = gr.left + n * gr.spotW;
        c.beginPath(); c.moveTo(x, y); c.lineTo(x, y + gr.rowH); c.stroke();
      }
      c.beginPath(); c.moveTo(gr.left, y + gr.rowH); c.lineTo(gr.left + nSpots * gr.spotW, y + gr.rowH); c.stroke();
    });
    // 车位号码 + 停好的车
    m.spots.forEach((s, i) => {
      const R = L.spotRect(m, i);
      const ns = Math.min(30, R.h * 0.3);
      if (i === m.glow) {
        const a = 0.35 + 0.35 * Math.sin(m.time * 8);
        c.fillStyle = 'rgba(255,214,0,' + a + ')'; c.fillRect(R.x + 2, R.y + 2, R.w - 4, R.h - 4);
      }
      if (g.hover === i) { c.fillStyle = 'rgba(255,255,255,.18)'; c.fillRect(R.x + 2, R.y + 2, R.w - 4, R.h - 4); }
      // 车位地上嘅圆点常驻（飞上嘅圆点照旧按 skill 撤）：读唔出号码都数得到粒数，知识一直喺画面
      const dn = s.n, dg = Math.min(15, R.w * 0.17), dr = Math.max(2.4, dg * 0.27);
      const drows = Math.ceil(dn / 4);
      c.fillStyle = 'rgba(241,243,245,.78)';
      for (let q = 0; q < dn; q++) {
        const rw = Math.floor(q / 4), col = q % 4, rowN = Math.min(4, dn - rw * 4);
        c.beginPath();
        c.arc(R.x + R.w / 2 - (rowN - 1) * dg / 2 + col * dg,
          R.y + R.h * 0.3 + rw * dg * 0.9 - (drows - 1) * dg * 0.45, dr, 0, Math.PI * 2);
        c.fill();
      }
      const label = m.rows.length > 1 ? m.rows[s.r] + s.n : String(s.n);
      text(c, label, R.x + R.w / 2, R.y + R.h - ns * 0.62, ns, '#f1f3f5');
      // 泊紧入去嗰架由 park() 画；过关画面时佢已经泊好，要照画
      const moving = m.phase === 'play' && m.car && m.car.state === 'park' && m.car.spot === i;
      if (s.occ && !moving) car(c, R.x + R.w / 2, R.y + (R.h - ns) / 2, s.occ.color, -Math.PI / 2, Math.min(R.h - ns - 6, R.w * 1.2));
    });
    return gr;
  }

  // 泊车飞：号码（+ 圆点）+ 字母
  function ticket(c, m, bounce) {
    const T = L.ticket, s = m.spots[m.car.target], multi = m.rows.length > 1;
    c.save();
    c.translate(T.x, T.y); c.scale(1 + bounce, 1 + bounce);
    rr(c, -T.w / 2, -T.h / 2 + 4, T.w, T.h, 14); c.fillStyle = 'rgba(0,0,0,.25)'; c.fill();
    rr(c, -T.w / 2, -T.h / 2, T.w, T.h, 14); c.fillStyle = '#fffdf2'; c.fill();
    c.fillStyle = '#e8590c'; rr(c, -T.w / 2, -T.h / 2, T.w, 30, 14); c.fill(); c.fillRect(-T.w / 2, -T.h / 2 + 16, T.w, 14);
    text(c, '泊車飛', 0, -T.h / 2 + 15, 17, '#fff');
    const cy = m.dots ? -6 : 14;
    if (multi) {
      const col = m.colors ? ROW_COLOR[s.r] : '#2b323b';
      text(c, m.rows[s.r], -40, cy, 72, col);
      text(c, String(s.n), 40, cy, 72, '#2b323b');
    } else text(c, String(s.n), 0, cy, 80, '#2b323b');
    if (m.dots) {
      // 四粒一行，五粒以上分两行（4 + n-4），方便一粒一粒数
      const n = s.n, gap = 19, cx = multi ? 40 : 0;
      for (let i = 0; i < n; i++) {
        const row = Math.floor(i / 4), col = i % 4, rowN = Math.min(4, n - row * 4);
        c.beginPath(); c.arc(cx - (rowN - 1) * gap / 2 + col * gap, 52 + row * 18 - (n > 4 ? 8 : 0), 7, 0, Math.PI * 2);
        c.fillStyle = '#e8590c'; c.fill();
      }
    }
    c.restore();
  }

  // 等紧嘅车喺入口；拖紧就跟住手指；泊入 / 退返有动画
  function carPos(g, gr) {
    const m = g.m, cr = m.car, G = L.gateCar;
    const len = Math.min(96, gr ? Math.min(gr.rowH - 26, gr.spotW * 1.2) * 1.05 : 96);
    if (cr.state === 'enter') {
      const p = easeOut(clamp01(cr.t / 1.4));
      return { x: G.x, y: lerp(L.H + 80, G.y, p), a: -Math.PI / 2, len: 96 };
    }
    if (g.drag) return { x: g.drag.x, y: g.drag.y, a: -Math.PI / 2, len: lerp(96, len, 0.5), lifted: true };
    if (cr.state === 'park') {
      const R = L.spotRect(m, cr.spot), ns = Math.min(30, R.h * 0.3);
      const from = cr.from || { x: G.x, y: G.y };
      const p = easeInOut(clamp01(cr.t / 1.0));
      return { x: lerp(from.x, R.x + R.w / 2, p), y: lerp(from.y, R.y + (R.h - ns) / 2, p), a: -Math.PI / 2, len: lerp(96, Math.min(R.h - ns - 6, R.w * 1.2), p) };
    }
    if (cr.state === 'back' && cr.from) {
      const p = easeOut(clamp01(cr.t / 0.6));
      return { x: lerp(cr.from.x, G.x, p), y: lerp(cr.from.y, G.y, p), a: -Math.PI / 2, len: 96 };
    }
    const wob = g.m.lock > 0 ? Math.sin(g.m.time * 40) * 5 : 0;
    return { x: G.x + wob, y: G.y, a: -Math.PI / 2, len: 96 };
  }

  function park(c, g) {
    const m = g.m;
    const gr = lot(c, g);
    // 入口闸
    c.fillStyle = '#f4f4f2'; rr(c, 728, 330, 30, 40, 6); c.fill();
    text(c, '入口', 826, 312, 18, '#e8c547');
    if (m.car && m.phase === 'play') {
      const pos = carPos(g, gr);
      if (m.car.state !== 'park' && !(m.car.state === 'enter' && m.car.t < 0.4)) ticket(c, m, 0);
      car(c, pos.x, pos.y + (pos.lifted ? -6 : 0), m.car.color, pos.a, pos.len);
      // 拖拽提示手指：车喺度等、仲未郁过
      if (m.car.state === 'wait' && !g.drag && m.k === 1 && m.level === 0 && m.idle > 2.5) {
        const p = (m.time % 1.6) / 1.6, tgt = L.spotRect(m, m.car.target);
        const fx = lerp(L.gateCar.x, tgt.x + tgt.w / 2, easeInOut(p)), fy = lerp(L.gateCar.y, tgt.y + tgt.h / 2, easeInOut(p));
        c.globalAlpha = 1 - p * 0.6;
        c.beginPath(); c.arc(fx, fy, 16, 0, Math.PI * 2); c.fillStyle = 'rgba(255,255,255,.75)'; c.fill();
        c.globalAlpha = 1;
      }
    }
    hud(c, g);
  }

  // ───────── 出闸关 ─────────
  function coin(c, x, y, r, dim) {
    c.beginPath(); c.arc(x, y + 3, r, 0, Math.PI * 2); c.fillStyle = 'rgba(0,0,0,.2)'; c.fill();
    c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fillStyle = dim ? '#c9cdd2' : '#f4c430'; c.fill();
    c.lineWidth = 3; c.strokeStyle = dim ? '#a5abb2' : '#c98a00'; c.stroke();
    c.beginPath(); c.arc(x, y, r * 0.66, 0, Math.PI * 2); c.lineWidth = 2; c.stroke();
    text(c, '$', x, y + 1, r * 0.9, dim ? '#a5abb2' : '#c98a00');
  }
  function pay(c, g) {
    const m = g.m, cr = m.car;
    c.fillStyle = '#c9e7f7'; c.fillRect(0, 0, L.W, 330);
    c.fillStyle = '#7a8591'; c.fillRect(0, 330, L.W, 110);
    c.fillStyle = '#e5e1d6'; c.fillRect(0, 440, L.W, 100);
    // 车道线
    c.setLineDash([26, 18]); c.strokeStyle = '#f1f3f5'; c.lineWidth = 4;
    c.beginPath(); c.moveTo(0, 336); c.lineTo(L.W, 336); c.stroke(); c.setLineDash([]);
    // 收费亭 + 显示屏
    const B = L.booth;
    c.fillStyle = '#e8590c'; rr(c, B.x - 150, 40, 300, 180, 18); c.fill();
    c.fillStyle = '#1d2228'; rr(c, B.x - 128, 62, 256, 110, 12); c.fill();
    text(c, '$' + m.price, B.x - (m.dots ? 50 : 0), 118, 76, '#ffd24a');
    if (m.dots) for (let i = 0; i < m.price; i++) {
      c.beginPath(); c.arc(B.x + 30 + (i % 3) * 24, 100 + Math.floor(i / 3) * 26, 9, 0, Math.PI * 2); c.fillStyle = '#ffd24a'; c.fill();
    }
    text(c, '畀錢', B.x, 196, 22, '#fff');
    // 投币槽：放咗几多个就排几多个（撳返可以拎走）
    const S = L.slotRow;
    rr(c, S.x, S.y, S.w, S.h, 28); c.fillStyle = 'rgba(29,34,40,.85)'; c.fill();
    for (let i = 0; i < m.coins; i++) coin(c, S.x + 34 + i * 46, S.y + S.h / 2, 20);
    // 闸杆
    const open = cr && cr.state === 'leave' ? clamp01(cr.t / 0.4) : 0;
    c.save(); c.translate(690, 300); c.rotate(-open * Math.PI * 0.45);
    c.fillStyle = '#fff'; c.fillRect(0, -7, 230, 14);
    c.fillStyle = '#e2463a'; for (let x = 20; x < 230; x += 50) c.fillRect(x, -7, 25, 14);
    c.restore();
    c.fillStyle = '#5b6470'; c.fillRect(676, 290, 28, 60);
    // 车
    if (cr) {
      let x = 470;
      if (cr.state === 'enter') x = lerp(-120, 470, easeOut(clamp01(cr.t / 1.4)));
      else if (cr.state === 'leave') x = lerp(470, L.W + 140, clamp01((cr.t - 0.4) / 1.4) ** 2);
      const wob = m.lock > 0 ? Math.sin(m.time * 40) * 4 : 0;
      car(c, x + wob, 388, cr.color, 0, 130);
    }
    // 钱箱：银仔
    L.tray.forEach(t => coin(c, t.x, t.y, t.r));
    // 开闸掣
    const ready = cr && cr.state === 'wait';
    roundBtn(c, L.gateBtn, ready ? '#2f8f5b' : '#9aa3ad', ready && m.coins > 0 ? Math.sin(m.time * 5) * 0.04 : 0);
    text(c, '開閘', L.gateBtn.x, L.gateBtn.y + 1, 30, '#fff');
    hud(c, g);
  }

  function hud(c, g) {
    const m = g.m;
    homeBtn(c); mute(c, g);
    for (let i = 0; i < m.cars; i++) {
      const x = 640 + i * 44 - (m.cars - 4) * 22, done = i < m.stars.length;
      // 出闸关背景系浅色天空：未拎嘅星要用深色先睇得到
      const empty = m.level === 3 ? 'rgba(29,34,40,.18)' : 'rgba(255,255,255,.18)';
      star(c, x, 40, 16, done ? (m.stars[i] ? '#ffd24a' : '#6b7480') : empty, done && m.stars[i] ? '#c98a00' : null);
    }
    if (m.hintN > 0 && m.car && m.car.state === 'wait') bear(c, 120, 40, 26);
  }

  function dim(c) { c.fillStyle = 'rgba(30,36,44,.55)'; c.fillRect(0, 0, L.W, L.H); }

  // ───────── 知识闸（每关出口一道题：答对才放行）─────────
  // 选项卡只画知识点本身：冇句子、冇红叉、冇分数、冇倒数；答错只系抖一下 + 变灰。
  function gateCard(c, r, ch, st) {
    c.save();
    rr(c, r.x, r.y + 6, r.w, r.h, 24); c.fillStyle = 'rgba(0,0,0,.28)'; c.fill();
    rr(c, r.x, r.y, r.w, r.h, 24); c.fillStyle = st.dim ? '#e9ecef' : '#fffdf2'; c.fill();
    c.lineWidth = 5; c.strokeStyle = st.glow ? '#ffd24a' : st.dim ? '#c9ced4' : '#dfe4ea'; c.stroke();
    if (st.glow) {
      const p = 5 + Math.sin(st.time * 6) * 4;
      rr(c, r.x - p, r.y - p, r.w + p * 2, r.h + p * 2, 26 + p);
      c.lineWidth = 5; c.strokeStyle = 'rgba(255,210,74,' + (0.32 + 0.3 * Math.sin(st.time * 6)).toFixed(3) + ')'; c.stroke();
    }
    const cx = r.x + r.w / 2, cy = r.y + r.h / 2, s = r.w;
    const ink = st.dim ? '#a8b0b8' : '#2b323b';
    if (ch.kind === 'spot') {
      text(c, String(ch.num), cx, cy - s * 0.11, s * 0.4, ink);
      // 地面圆点：数得到就唔怕读唔出个号码
      const n = ch.num, dg = s * 0.1, rows = Math.ceil(n / 4), dr = Math.max(3, dg * 0.27);
      for (let q = 0; q < n; q++) {
        const rw = Math.floor(q / 4), col = q % 4, rowN = Math.min(4, n - rw * 4);
        c.beginPath();
        c.arc(cx - (rowN - 1) * dg / 2 + col * dg,
          cy + s * 0.23 + rw * dg * 0.9 - (rows - 1) * dg * 0.45, dr, 0, Math.PI * 2);
        c.fillStyle = st.dim ? '#a8b0b8' : '#e8590c'; c.fill();
      }
    } else if (ch.kind === 'num') {
      text(c, String(ch.num), cx, cy, s * 0.56, ink);
    } else if (ch.kind === 'row') {
      text(c, String(ch.letter), cx, cy - s * 0.22, s * 0.32, st.dim ? '#a8b0b8' : '#2a7fd4');
      const bw = s * 0.24, bh = s * 0.3, gy = cy + s * 0.04;
      for (let q = 0; q < 3; q++) {
        const bx = cx + (q - 1) * (bw + s * 0.035);
        rr(c, bx - bw / 2, gy, bw, bh, 8); c.lineWidth = 3;
        c.strokeStyle = st.dim ? '#c9ced4' : '#9aa3ad'; c.stroke();
        text(c, String(ch.letter) + ch.num, bx, gy + bh / 2, bw * 0.52, ink, 'center', 700);
      }
    } else if (ch.kind === 'coins') {
      const n = ch.num, cols = n <= 2 ? n : 2, rows = Math.ceil(n / cols);
      const rr0 = Math.min(28, s * 0.12), step = rr0 * 2.15;
      for (let q = 0; q < n; q++) {
        const col = q % cols, row = Math.floor(q / cols);
        coin(c, cx + (col - (cols - 1) / 2) * step, cy + (row - (rows - 1) / 2) * step, rr0, st.dim);
      }
    }
    c.restore();
  }

  function gatePanel(c, g) {
    if (g.m.level === 3) pay(c, g); else park(c, g);   // 底图照画：刚泊好嘅车留喺画面
    dim(c);
    const v = g.gate();
    if (!v) return;
    rr(c, 92, 124, 776, 358, 30); c.fillStyle = 'rgba(24,30,38,.8)'; c.fill();
    // 小熊 + 语音气泡 = 题面（气泡里唔写句子：星星唔识字）
    bear(c, 118, 92, 40);
    c.beginPath(); c.arc(188, 68, 20, 0, Math.PI * 2); c.fillStyle = '#fff'; c.fill();
    c.fillStyle = '#2b323b';
    for (let i = 0; i < 3; i++) { c.beginPath(); c.arc(178 + i * 10, 68, 3.4, 0, Math.PI * 2); c.fill(); }
    const wrong = v.stage === 1 ? v.wrong : -1;   // 只喺重问嗰档标灰：二选一时留灰 = 可以靠「唔灰」估答案
    const wob = g.m.lock > 0 ? Math.sin(g.m.time * 40) * 6 : 0;
    L.gateCards(v.choices.length).forEach((r, i) => {
      const ch = v.choices[i];
      if (!ch) return;
      gateCard(c, { x: r.x + (i === wrong ? wob : 0), y: r.y, w: r.w, h: r.h }, ch,
        { dim: i === wrong, glow: v.glow === i, time: g.m.time });
    });
  }

  function intro(c, g) {
    const m = g.m;
    if (m.level === 3) pay(c, g); else lot(c, g);
    dim(c);
    rr(c, 180, 110, 600, 320, 26); c.fillStyle = '#fffdf7'; c.fill();
    bear(c, 290, 220, 70);
    text(c, LEVEL_NAME[m.level], 560, 186, 44, '#2b323b');
    text(c, LEVEL_SUB[m.level], 560, 240, 26, '#5b6470', 'center', 700);
    const p = m.t >= 0.8 ? Math.sin(m.time * 5) * 0.05 : 0;
    roundBtn(c, { x: 560, y: 340, r: 46 }, '#2f8f5b', p);
    playIcon(c, 564, 340, 40);
  }

  function title(c, g, splash) {
    const m = g.m;
    c.fillStyle = '#3a4350'; c.fillRect(0, 0, L.W, L.H);
    // 背景：几条车位线 + 几架泊好的车
    c.strokeStyle = 'rgba(255,255,255,.12)'; c.lineWidth = 3;
    for (let x = 0; x < L.W; x += 80) { c.beginPath(); c.moveTo(x, 470); c.lineTo(x, L.H); c.stroke(); }
    ParkModel.LIVERIES.forEach((col, i) => car(c, 40 + i * 120, 505, col, -Math.PI / 2, 60));
    if (splash) {
      text(c, '停車場小管理員', L.W / 2, 150, 64, '#fff');
      text(c, '睇飛泊車 · 數銀仔開閘', L.W / 2, 220, 26, '#c9d1da', 'center', 700);
      roundBtn(c, L.splashPlay, '#e8590c', Math.sin(m.time * 4) * 0.04);
      playIcon(c, L.splashPlay.x + 6, L.splashPlay.y, 70);
      return;
    }
    bear(c, L.bear.x, L.bear.y, L.bear.r);
    text(c, '停車場小管理員', 520, 96, 46, '#fff');
    text(c, '揀一關', 520, 146, 22, '#c9d1da', 'center', 700);
    roundBtn(c, L.garage, '#e8590c');
    car(c, L.garage.x, L.garage.y, ParkModel.LIVERIES[0], 0, 50, { noShadow: true });
    mute(c, g);
    L.tiles.forEach((t, i) => {
      // 关卡全开：4 张卡一律用解锁态画（冇锁、冇灰砖）
      rr(c, t.x, t.y + 5, t.w, t.h, 20); c.fillStyle = 'rgba(0,0,0,.25)'; c.fill();
      rr(c, t.x, t.y, t.w, t.h, 20); c.fillStyle = '#fffdf7'; c.fill();
      c.save(); rr(c, t.x, t.y, t.w, t.h, 20); c.clip();
      c.fillStyle = TILE_BAND[i]; c.fillRect(t.x, t.y, t.w, 70);
      c.restore();
      text(c, String(i + 1), t.x + t.w / 2, t.y + 36, 40, '#fff');
      text(c, LEVEL_NAME[i], t.x + t.w / 2, t.y + 110, 28, '#2b323b');
      text(c, LEVEL_SUB[i], t.x + t.w / 2, t.y + 148, 18, '#5b6470', 'center', 600);
      const n = ParkModel.LEVELS[i].cars;
      for (let k = 0; k < n; k++) star(c, t.x + t.w / 2 + (k - (n - 1) / 2) * 32, t.y + 206, 13, k < m.best[i] ? '#ffd24a' : '#e3e6ea', k < m.best[i] ? '#c98a00' : null);
    });
  }

  function levelDone(c, g) {
    const m = g.m;
    if (m.level === 3) pay(c, g); else lot(c, g);
    dim(c);
    rr(c, 200, 80, 560, 390, 26); c.fillStyle = '#fffdf7'; c.fill();
    const got = m.stars.filter(Boolean).length;
    text(c, m.passed ? '做得好！' : '再試多次', 480, 140, 44, '#2b323b');
    m.stars.forEach((s, i) => {
      const p = clamp01((m.t - 0.3 - i * 0.25) / 0.3);
      if (p > 0) star(c, 480 + (i - (m.stars.length - 1) / 2) * 70, 220, 28 * easeOut(p), s ? '#ffd24a' : '#d4d8dd', s ? '#c98a00' : null);
    });
    if (m.newCar >= 0 && m.t > 1.6) {
      text(c, '新車仔！', 380, 300, 24, '#e8590c');
      car(c, 500, 300, ParkModel.LIVERIES[m.newCar], 0, 90 * easeOut(clamp01((m.t - 1.6) / 0.4)));
    }
    const hasNext = m.passed && m.level < ParkModel.LEVELS.length - 1;
    const rp = L.replay(hasNext);
    roundBtn(c, rp, '#5b6470');
    c.strokeStyle = '#fff'; c.lineWidth = 6; c.lineCap = 'round';
    c.beginPath(); c.arc(rp.x, rp.y, 17, -0.3, Math.PI * 1.5); c.stroke();
    c.fillStyle = '#fff'; c.beginPath(); c.moveTo(rp.x + 2, rp.y - 26); c.lineTo(rp.x + 12, rp.y - 17); c.lineTo(rp.x, rp.y - 9); c.closePath(); c.fill();
    if (hasNext) { roundBtn(c, L.next, '#2f8f5b', Math.sin(m.time * 5) * 0.05); playIcon(c, L.next.x + 4, L.next.y, 44); }
    void got;
  }

  function garage(c, g) {
    const m = g.m;
    c.fillStyle = '#3a4350'; c.fillRect(0, 0, L.W, L.H);
    text(c, '我的車仔', L.W / 2, 70, 40, '#fff');
    ParkModel.LIVERIES.forEach((col, i) => {
      const x = 150 + (i % 4) * 220, y = 200 + Math.floor(i / 4) * 190;
      c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 3;
      c.beginPath(); c.moveTo(x - 60, y - 70); c.lineTo(x - 60, y + 70); c.moveTo(x + 60, y - 70); c.lineTo(x + 60, y + 70); c.stroke();
      if (i < m.garage) car(c, x, y, col, -Math.PI / 2, 120);
      else text(c, '?', x, y, 60, 'rgba(255,255,255,.3)');
    });
    homeBtn(c);
  }

  function draw(c, g) {
    const m = g.m;
    c.clearRect(0, 0, L.W, L.H);
    if (m.phase === 'splash') return title(c, g, true);
    if (m.phase === 'title') return title(c, g, false);
    if (m.phase === 'garage') return garage(c, g);
    if (m.phase === 'intro') return intro(c, g);
    if (m.phase === 'gate') return gatePanel(c, g);
    if (m.phase === 'levelDone') return levelDone(c, g);
    if (m.level === 3) pay(c, g); else park(c, g);
  }

  return { load, draw, carPos, LEVEL_NAME };
})();

</script>
<script>
'use strict';
/* 幼儿游戏共用的家长时间控制；模型可在 Node 单测，UI 只在浏览器加载。 */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  if (root) root.KidsTime = api;
})(typeof window !== 'undefined' ? window : null, function () {
  const STORAGE_KEY = 'kidsGames.time';
  const DEFAULT_MINUTES = 15;
  const OPTIONS = [0, 5, 10, 15, 20, 30];

  function normalize(raw) {
    try {
      const v = typeof raw === 'string' ? JSON.parse(raw) : raw;
      if (!v || v.v !== 1 || !OPTIONS.includes(v.limit)) return null;
      if (typeof v.remaining !== 'number' || !Number.isFinite(v.remaining) || v.remaining < 0 || v.remaining > 604800) return null;
      return { limit: v.limit, remaining: v.remaining };
    } catch (e) { return null; }
  }

  class Model {
    constructor(options) {
      const opts = options || {};
      this.storage = opts.storage || null;
      this.now = opts.now || Date.now;
      let saved = null;
      try { saved = normalize(this.storage && this.storage.getItem(STORAGE_KEY)); } catch (e) { /* 无痕模式也能玩 */ }
      this.limit = saved ? saved.limit : DEFAULT_MINUTES;
      this.remaining = saved ? saved.remaining : DEFAULT_MINUTES * 60;
      this.lastNow = this.now();
      this.lastSaved = this.lastNow;
      this.dirty = false;
    }

    get expired() { return this.limit > 0 && this.remaining <= 0; }
    get unlimited() { return this.limit === 0; }

    tick(active) {
      const now = this.now();
      const elapsed = Math.max(0, (now - this.lastNow) / 1000);
      this.lastNow = now;
      if (active && !this.unlimited && !this.expired && elapsed > 0) {
        this.remaining = Math.max(0, this.remaining - elapsed);
        this.dirty = true;
      }
      // 切到后台、时间到或每 5 秒落一次盘，刷新 / 换游戏不会平白多出一轮。
      if (this.dirty && (!active || now - this.lastSaved >= 5000)) this.save();
      return this.remaining;
    }

    save() {
      this.dirty = false;
      this.lastSaved = this.now();
      try {
        if (this.storage) this.storage.setItem(STORAGE_KEY, JSON.stringify({
          v: 1, limit: this.limit, remaining: Math.round(this.remaining * 1000) / 1000
        }));
      } catch (e) { /* 存不了只影响下次打开，当前这轮照常计时 */ }
    }

    newSession(minutes) {
      if (!OPTIONS.includes(minutes)) throw new RangeError('Unsupported time limit');
      this.limit = minutes;
      this.remaining = minutes * 60;
      this.lastNow = this.now();
      this.save();
    }

    addMinutes(minutes) {
      if (!Number.isFinite(minutes) || minutes <= 0 || minutes > 60) throw new RangeError('Invalid extra time');
      if (!this.unlimited) this.remaining = Math.min(604800, this.remaining + minutes * 60);
      this.lastNow = this.now();
      this.save();
    }

    sync(raw) {
      const v = normalize(raw);
      if (!v) return;
      this.limit = v.limit;
      this.remaining = v.remaining;
      this.lastNow = this.now();
      this.dirty = false;
    }
  }

  function format(seconds) {
    const total = Math.max(0, Math.ceil(seconds));
    return Math.floor(total / 60) + ':' + String(total % 60).padStart(2, '0');
  }

  const CSS = `
    .kt-status{position:fixed;z-index:40;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;border:2px solid rgba(255,255,255,.85);border-radius:999px;background:rgba(31,39,51,.88);color:#fff;padding:7px 14px;font:700 17px/1.2 -apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC",sans-serif;box-shadow:0 3px 12px rgba(0,0,0,.18);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
    .kt-status small{font-size:12px;font-weight:600;opacity:.8}.kt-status.kt-low{background:#a43b16;animation:kt-pulse 1s ease-in-out infinite}
    @keyframes kt-pulse{50%{transform:translateX(-50%) scale(1.05)}}

  function mount(options) {

    document.head.appendChild(style);

    root.id = 'kidsTime';
    root.innerHTML = `
      <button class="kt-status" type="button" aria-label="家長時間控制，長按開啟"><span data-role="time"></span><small>家長長按</small></button>
      <div class="kt-layer kt-done" data-role="done" role="dialog" aria-modal="true" aria-labelledby="ktDoneTitle" hidden>
        <div class="kt-card"><div class="kt-done-icon" aria-hidden="true">🌙</div><h1 id="ktDoneTitle">時間到，休息吓</h1>
          <p>呢輪玩完喇，畀對眼休息一下。<br>如果想再玩，請家長加時間。</p>
          <button class="kt-parent-open" data-role="open" type="button">家長設定（長按）</button>
          <p class="kt-hold-hint">長按 1.5 秒開啟</p></div>
      </div>
      <div class="kt-layer" data-role="panel" role="dialog" aria-modal="true" aria-labelledby="ktPanelTitle" hidden>
        <div class="kt-card"><h2 id="ktPanelTitle">家長時間控制</h2>
          <p>各款幼兒遊戲<b>共用呢輪時間</b>。<br>切到背景、旋轉提示或家長面板開著時，時鐘會暫停。</p>
          <div class="kt-remaining" data-role="remaining"></div>
          <fieldset class="kt-options"><legend>開始新一輪</legend>

          </fieldset>
          <div class="kt-actions"><button type="button" data-role="add">加 5 分鐘</button><button type="button" class="kt-primary" data-role="start">開始新一輪</button><button type="button" data-role="close">關閉</button></div>

    const status = root.querySelector('.kt-status');
    const timeText = root.querySelector('[data-role="time"]');
    const done = root.querySelector('[data-role="done"]');
    const panel = root.querySelector('[data-role="panel"]');
    const remainingText = root.querySelector('[data-role="remaining"]');
    const addButton = root.querySelector('[data-role="add"]');
    let dialogOpen = false, lastTimeText = '';

    function render() {
      const text = model.unlimited ? '不限時' : format(model.remaining);
      if (text !== lastTimeText) { timeText.textContent = text; lastTimeText = text; }
      status.classList.toggle('kt-low', !model.unlimited && model.remaining <= 60);
      status.setAttribute('aria-label', (model.unlimited ? '目前不限時。' : '剩餘 ' + text + '。') + '家長長按開啟時間控制');
      done.hidden = dialogOpen || !model.expired;
      panel.hidden = !dialogOpen;
      remainingText.textContent = model.unlimited ? '目前不限時' : '今輪仲剩 ' + format(model.remaining);
      addButton.disabled = model.unlimited;
    }

    function tick(active) {
      model.tick(!!active && !dialogOpen && !document.hidden && !model.expired);
      render();
    }

    function openParent() {
      model.tick(false);
      dialogOpen = true;
      render();
      root.querySelector('[data-role="close"]').focus();
    }
    function closeParent() {
      dialogOpen = false;
      model.tick(false);
      render();
      (model.expired ? root.querySelector('[data-role="open"]') : status).focus();
    }

    function holdable(el) {
      let timer = null;
      const cancel = () => { if (timer) clearTimeout(timer); timer = null; };
      el.addEventListener('pointerdown', e => {
        if (e.button && e.button !== 0) return;
        e.preventDefault(); e.stopPropagation(); cancel();
        timer = setTimeout(() => { timer = null; openParent(); }, (options && options.holdMs) || 1500);
      });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(name => el.addEventListener(name, cancel));
      el.addEventListener('click', e => {
        e.preventDefault(); e.stopPropagation();
        if (e.detail === 0) openParent();       // 键盘 Enter / Space 也可打开，不让家长卡在长按手势上
      });
      el.addEventListener('contextmenu', e => e.preventDefault());
    }
    holdable(status);
    holdable(root.querySelector('[data-role="open"]'));
    root.querySelector('[data-role="add"]').addEventListener('click', () => { model.addMinutes(5); closeParent(); });
    root.querySelector('[data-role="start"]').addEventListener('click', () => {
      const chosen = root.querySelector('input[name="ktLimit"]:checked');
      model.newSession(Number(chosen.value)); closeParent();
    });
    root.querySelector('[data-role="close"]').addEventListener('click', closeParent);
    document.addEventListener('keydown', e => {
      if (!dialogOpen) return;
      if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); closeParent(); return; }
      if (e.key !== 'Tab') return;
      const focusable = Array.from(panel.querySelectorAll('button:not(:disabled), input')).filter(el => el.offsetParent !== null);
      if (!focusable.length) return;
      const first = focusable[0], last = focusable[focusable.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }, true);
    document.addEventListener('visibilitychange', () => { model.tick(false); render(); });
    window.addEventListener('pagehide', () => model.tick(false));
    window.addEventListener('pageshow', () => model.tick(false));
    window.addEventListener('storage', e => { if (e.key === STORAGE_KEY) { model.sync(e.newValue); render(); } });
    render();

    return {
      model, tick, openParent, closeParent,
      get blocked() { return model.expired; },
      get dialogOpen() { return dialogOpen; }
    };
  }

  return { Model, mount, format, normalize, STORAGE_KEY, DEFAULT_MINUTES, OPTIONS };
});

'use strict';

  // 所以档位名字要跟计分口径对上，不能只当装饰。
  const STAGES = ['ask', 'hint', 'narrow', 'show'];

  // idleToShow：走神保护（45 秒没点就把画面压到只剩正确答案），它绝不代替小朋友点。

      for (let i = 0; i < cur.visible.length; i++) if (cur.visible[i] !== cur.rightOrig) n++;

      r.streak = 0;                                 // 一次错就断连续记录，mastered 可能退回 false
      r.mastered = mastered(r);
      cur.attempts = Math.min(CAP.attempts, cur.attempts + 1);
      emit('sfx', 'boop');
      descend();
      return 'teach';
    }

    // 返回 null | 'open'。'open' = 可以进 levelDone 了。全程只有「答对 + hold 满」才会 'open'：
    // 没有任何超时自动放行（decisions D2 的第一条铁律）。
    function tick(dt) {
      if (!cur) return null;
      let d = Number(dt);
      if (!isFinite(d) || d <= 0) d = 0;            // 卡帧 / 负数 dt 不能让计时器倒退
      if (cur.opened) {
        cur.holdT += d;
        return cur.holdT + EPS >= CAP.hold ? 'open' : null;
      }
      cur.idle += d;
      if (cur.stage < 3 && cur.idle + EPS >= CAP.idleToShow) {
        goStage(3);                                 // 走神保护：直接压到只剩正确答案，但不 opened
      }
      return null;
    }

    function view() {
      if (!cur) return null;
      const choices = visibleCards();
      const right = rightAt();
      return {
        kp: cur.kp,
        stage: cur.stage,
        choices: choices,                           // 已经是「这一刻该显示的那几张」
        right: right,
        attempts: cur.attempts,
        // glow 只在 show 档给（decisions §3.1：narrow 是「两张放大」、show 才是「脉冲发光」）。
        // narrow 档渲染层看 stage===2 或 choices.length===2 就知道要放大。
        glow: cur.stage >= 3 ? right : -1,
        wrong: cur.wrongOrig >= 0 ? cur.visible.indexOf(cur.wrongOrig) : -1,
        removed: cur.removed.slice(),               // 原数组下标，给「移走」动画用
        opened: cur.opened,
        byRescue: cur.byRescue
      };
    }

    function dump() {
      const out = {};
      Object.keys(kb).forEach(function (k) {
        const r = kb[k];
        out[k] = {
          seen: r.seen, f: r.f, w: r.w, res: r.res, streak: r.streak,
          lastLevel: r.lastLevel, lastTs: r.lastTs, mastered: r.mastered
        };
      });
      return out;                                   // 深拷贝：存档方改它不会污染闸门内部
    }

    function state() {
      const kbs = dump();
      const mastery = {};
      Object.keys(kbs).forEach(function (k) { mastery[k] = [kbs[k].f, kbs[k].w]; });
      return {
        active: !!cur && !cur.opened,               // 闸门还在等作答；opened 之后为 false 但 tick 仍会回 'open'
        kp: cur ? cur.kp : null,
        attempts: cur ? cur.attempts : 0,
        stage: cur ? cur.stage : -1,
        opened: !!cur && cur.opened,
        byRescue: !!cur && cur.byRescue,
        mastery: mastery,                           // 投影，供旧约定 / 家长面板
        kb: kbs
      };
    }

    function load(raw) {
      kb = clampKb(raw, Object.keys(kps));
      return dump();
    }

    // Esc / 回主页：这一次开题当没发生过（decisions §3.1「離開不算答錯，seen 不結算」）。
    // 只回滚 seen（夹 ≥0）；不记 w、不加 attempts、不置 opened、不发任何音效语音。
    // 清掉 cur 之后 tick() 一律返回 null，所以绝不可能因为 abort 过就漏出一个 'open'。
    // 没有当前题时是 no-op（返回 false），连按 Esc 也安全。
    // 已经答对（opened，正在等 hold 放行）也算结算过了：这时 abort 是 no-op ——
    // 不然会把 seen 回滚成「f=1 而 seen=0」的坏记录，还会把已经放行的题偷回去。
    function abort() {
      if (!cur || cur.opened) return false;
      const kpId = cur.kp;
      cur = null;                                   // 先清题：清掉之后 view()=null，tick() 也永远 null
      if (has(kb, kpId)) {
        const r = kb[kpId];
        r.seen = count(r.seen - 1);                 // count() 已经夹住 0..MAX，不会出现 -1
        r.mastered = mastered(r);                   // seen 掉了可能让「学会了」退回 false，重算
      }
      return true;
    }

    // R2 选下一个考哪个（decisions §4.1）。cands 是本关 / 本线的候选 kpId。
    //
    // 口径：**只排序，不排除**。答错过的知识点**下一局就优先补考**（产品只要求「至少间隔 1 局」，
    // 不是「隔一天」），所以不能按日子排除候选 —— 孩子今天在闸门里答错了「園」，当天再玩同一关
    // 就该再考它。原来那句「同一 id 连考保护」现在用「同一条里把刚考过的那张排到最后」实现，
    // 不用任何时间窗口；那张永远还留在候选里，候选只剩它一个时照样返回它。
    //
    // now 保留在签名里给调用方（各游戏照原样传时间戳），但 pick 已经不按时间筛选，只用 lastTs 排序。
    function pick(cands, now) {
      if (!Array.isArray(cands)) return null;
      const list = [];
      for (let i = 0; i < cands.length; i++) {
        const id = cands[i];
        if (typeof id !== 'string' || !id) continue;
        if (list.indexOf(id) < 0) list.push(id);
      }
      if (!list.length) return null;
      if (list.length === 1) return list[0];

      // 刚刚才考过的那张（lastTs 最新）：只影响排序，不参与筛选
      let latest = null, latestTs = 0;
      for (let i = 0; i < list.length; i++) {
        const r = has(kb, list[i]) ? kb[list[i]] : null;
        if (r && r.lastTs > latestTs) { latestTs = r.lastTs; latest = list[i]; }
      }

      // 1. 错过 / 被救过又还没学会的，先补考；lastTs 最旧的那张优先，
      //    而这一组里刚考过的那张排到最后（候选只有它时就它上）
      const due = [];
      for (let i = 0; i < list.length; i++) {
        const id = list[i];
        const r = has(kb, id) ? kb[id] : null;
        if (r && r.w + r.res > 0 && !mastered(r)) due.push({ id: id, ts: r.lastTs, i: i });
      }
      if (due.length) {
        // ts 并列时按 cands 里的先后（sort 是稳定的，显式再比一次 i 更保险）
        due.sort(function (x, y) { return (x.ts - y.ts) || (x.i - y.i); });
        const order = due.map(function (x) { return x.id; });
        const at = latest ? order.indexOf(latest) : -1;
        if (at >= 0 && at < order.length - 1) { order.splice(at, 1); order.push(latest); }
        return order[0];
      }

      // 2. 没考过的新知识点（按 cands 顺序）
      for (let i = 0; i < list.length; i++) if (!has(kb, list[i])) return list[i];

      // 3. 考得最少的（并列时顺其自然取前面那个；刚考过的那张并列时让位）
      let fewest = list[0];
      for (let i = 1; i < list.length; i++) {
        if (kb[list[i]].seen < kb[fewest].seen) fewest = list[i];
      }
      if (fewest === latest) {
        for (let i = 0; i < list.length; i++) {
          const id = list[i];
          if (id !== latest && kb[id].seen === kb[latest].seen) { fewest = id; break; }
        }
      }
      // 4. 全 mastered 也给一个，绝不返回 null（产品要「全开、能一直玩」）
      return fewest;
    }

    return { start, answer, abort, tick, view, state, load, dump, pick };
  }

  return { create, mastered, clampKb, STAGES, CAP, newRec };
});

</script>
<script>
'use strict';
// 外壳：画布缩放、输入（拖车 / 撳车位 / 放银仔）、主循环、存储、家长记录。
(() => {
  const L = Layout;
  const cv = document.getElementById('cv'), c = cv.getContext('2d');
  const panel = document.getElementById('parent');
  const g = ParkModel.create(Math.random);
  const clock = KidsTime.mount();
  g.muted = false;
  g.drag = null;     // 拖紧架车：{x, y}
  g.hover = -1;      // 拖紧时手指下面嗰个车位
  let scale = 1, paused = false, last = 0, holdTimer = null, audioPaused = false, downAt = null;

  const store = {
    get(k, d) { try { const v = localStorage.getItem('parkingLot.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('parkingLot.' + k, JSON.stringify(v)); } catch (e) { /* 存不了照玩 */ } }
  };
  g.restore(store.get('progress', null));
  g.muted = !!store.get('prefs', {}).muted;
  ParkAudio.setMuted(g.muted);
  ParkRender.load();

  function resize() {
    const vw = window.innerWidth, vh = window.innerHeight;
    paused = vh > vw;
    document.body.classList.toggle('portrait', paused);
    scale = Math.min(vw / L.W, vh / L.H);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.style.width = L.W * scale + 'px'; cv.style.height = L.H * scale + 'px';
    cv.width = Math.round(L.W * scale * dpr); cv.height = Math.round(L.H * scale * dpr);
    c.setTransform(cv.width / L.W, 0, 0, cv.height / L.H, 0, 0);
  }

  function flush() {
    const ev = g.m.events.splice(0);
    // 每次认啱认错都落盘：中途离开，家长记录都不会少
    if (ev.some(e => e.t === 'sfx' && ['buzz', 'beep', 'gate'].includes(e.name))) store.set('progress', g.snapshot());
    ev.forEach(e => {
      if (e.t === 'sfx') ParkAudio.sfx(e.name);
      else if (e.t === 'voice') ParkAudio.voice(e.name);
      else if (e.t === 'log') {
        const log = store.get('log', []);
        log.push(Object.assign({ ts: Date.now() }, e.data));
        store.set('log', log.slice(-60));
        store.set('progress', g.snapshot());
      }
    });
  }

  const inCircle = (p, b, pad) => Math.hypot(p.x - b.x, p.y - b.y) <= b.r + (pad || 0);
  const inRect = (p, r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
  const spotAt = p => g.m.spots.findIndex((s, i) => inRect(p, L.spotRect(g.m, i)));
  const onCar = p => Math.abs(p.x - L.gateCar.x) < 70 && Math.abs(p.y - L.gateCar.y) < 80;

  function toggleMute() {
    g.muted = !g.muted;
    ParkAudio.setMuted(g.muted);
    store.set('prefs', { muted: g.muted });
  }

  // 车位选择：from = 车由边度开过去（拖到放手嘅位置，或者入口）
  function choose(i, from) {
    if (i < 0 || !g.carReady()) return;
    g.m.car.from = from || { x: L.gateCar.x, y: L.gateCar.y };
    g.choose(i);
  }

  function tap(p) {
    const m = g.m;
    if (m.phase === 'splash') return g.advance();
    if (m.phase === 'garage') { if (inCircle(p, L.home, 8)) g.home(); return; }
    if (inCircle(p, L.mute, 8)) return toggleMute();
    if (m.phase === 'title') {
      if (inCircle(p, L.garage, 8)) { if (g.openGarage()) ParkAudio.sfx('tap'); return; }
      const i = L.tiles.findIndex(t => inRect(p, t));
      if (i >= 0 && g.selectLevel(i)) ParkAudio.sfx('tap');
      return;
    }
    if (inCircle(p, L.home, 8)) return g.home();
    // 知识闸：照 view().choices 当前显示嗰几张直接按下标点（卡位同 Layout.gateCards 同一份数）
    if (m.phase === 'gate') {
      const gv = g.gate();
      if (!gv) return;
      const cards = L.gateCards(gv.choices.length);
      const hit = cards.findIndex(r => inRect(p, { x: r.x - 14, y: r.y - 14, w: r.w + 28, h: r.h + 28 }));
      if (hit >= 0 && g.gateAnswer(hit)) flush();
      return;
    }
    if (m.phase === 'intro') { if (g.advance()) ParkAudio.sfx('tap'); return; }
    if (m.phase === 'levelDone') {
      const hasNext = m.passed && m.level < ParkModel.LEVELS.length - 1;
      if (hasNext && inCircle(p, L.next, 10)) g.next();
      else if (inCircle(p, L.replay(hasNext), 10)) g.replay();
      return;
    }
    if (m.phase !== 'play') return;
    if (m.level === 3) {
      if (inCircle(p, L.gateBtn, 10)) return g.openGate();
      if (L.tray.some(t => inCircle(p, t, 8))) return g.insertCoin();
      if (inRect(p, L.slotRow)) return g.takeCoin();
      // 撳收费亭 = 再讲一次要几多
      if (Math.abs(p.x - L.booth.x) < 150 && p.y > 40 && p.y < 220) return g.repeatTicket();
      return;
    }
    // 撳张飞 = 再读一次
    const T = L.ticket;
    if (Math.abs(p.x - T.x) < T.w / 2 && Math.abs(p.y - T.y) < T.h / 2) return g.repeatTicket();
    choose(spotAt(p));
  }

  function point(e) {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale };
  }

  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    ParkAudio.unlock();
    if (paused || clock.blocked || clock.dialogOpen) return;
    const p = point(e);
    if (g.m.phase === 'title' && inCircle(p, L.bear, 6)) holdTimer = setTimeout(showParent, 1500);
    // 喺入口揸住架车 = 开始拖
    if (g.m.phase === 'play' && g.m.level !== 3 && g.carReady() && onCar(p)) {
      try { cv.setPointerCapture(e.pointerId); } catch (err) { /* 冇都照拖 */ }
      g.drag = p; downAt = p;
      ParkAudio.sfx('tap');
      flush();
      return;
    }
    tap(p);
    flush();
  });
  cv.addEventListener('pointermove', e => {
    if (!g.drag) return;
    const p = point(e);
    g.drag = p;
    const i = spotAt(p);
    g.hover = i;
  });
  function endDrag(e, cancel) {
    clearTimeout(holdTimer);
    if (!g.drag) return;
    const p = g.drag;
    g.drag = null; g.hover = -1;
    if (cancel || !g.carReady()) return;
    const moved = downAt && Math.hypot(p.x - downAt.x, p.y - downAt.y) > 20;
    const i = spotAt(p);
    if (i >= 0) choose(i, p);
    // 拖去唔系车位嘅地方：车自己开返入口（唔算错）
    else if (moved) { g.m.car.from = p; g.m.car.state = 'back'; g.m.car.t = 0; }
    flush();
  }
  cv.addEventListener('pointerup', e => endDrag(e, false));
  cv.addEventListener('pointercancel', e => endDrag(e, true));
  cv.addEventListener('contextmenu', e => e.preventDefault());

  window.addEventListener('keydown', e => {
    if (e.repeat || paused || !panel.hidden || clock.blocked || clock.dialogOpen) return;
    ParkAudio.unlock();
    const m = g.m;
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (!g.advance()) {
        if (m.phase === 'play' && m.level === 3) g.openGate();
        else if (!g.next()) g.replay();
      }
    } else if (e.code === 'KeyC' && m.level === 3) g.insertCoin();
    else if (e.code === 'Backspace' && m.level === 3) g.takeCoin();
    else if (e.code === 'KeyR') g.repeatTicket();
    else if (e.code === 'KeyM') toggleMute();
    // 闸门都可以用键盘：1 / 2 / 3 揀卡（有字嘅按钮之外再留一条无障碍路径）
    else if (m.phase === 'gate' && /^Digit[1-3]$/.test(e.code)) {
      const i = Number(e.code.slice(5)) - 1, gv = g.gate();
      if (gv && i < gv.choices.length) g.gateAnswer(i);
    }
    // 闸内回主页：model.home() 会顺手做 kg.abort()（道题当冇问过，唔算答错、唔会漏放行）
    else if (e.code === 'Escape') g.home();
    flush();
  });

  const esc = s => String(s).replace(/[&<>]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[ch]);
  function showParent() {
    if (clock.blocked || clock.dialogOpen) return;
    const names = ParkRender.LEVEL_NAME;
    const rows = store.get('log', []).slice(-12).reverse().map(r => {
      const d = new Date(r.ts);
      const when = (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
      return '<tr><td>' + when + '</td><td>' + esc(names[r.level]) + '</td><td>' + r.stars + ' / ' + r.cars + '</td><td>' + r.num +
        '</td><td>' + r.zone + '</td><td>' + r.pay + '</td><td>' + ((r.skill | 0) + 1) + '</td></tr>';
    }).join('');
    const label = k => k[0] === 'L' ? '字母 ' + k.slice(2) : k[0] === 'N' ? '號碼 ' + k.slice(2) : '畀 ' + k.slice(2) + ' 個銀仔';
    const st = g.m.stats;
    const statRows = Object.keys(st).filter(k => /^[LNP]_/.test(k)).sort((a, b) => st[b][1] - st[a][1] || a.localeCompare(b))
      .map(k => '<tr><td>' + esc(label(k)) + '</td><td>' + st[k][0] + '</td><td>' + st[k][1] + '</td></tr>').join('');
    panel.innerHTML = '<div class="box"><h2>家長記錄</h2>' +
      '<p>認錯號碼 = 泊咗去另一個號碼；認錯字母 = 號碼啱但係行唔啱。畀錯錢 = 銀仔數唔啱就撳開閘。等太耐冇動，第二次提示會閃出車位，嗰架車唔計星。難度 1–3：成關冇錯，下次車位多啲、號碼大啲、圓點會收起。</p>' +
      (rows ? '<table><tr><th>時間</th><th>關卡</th><th>星</th><th>認錯號碼</th><th>認錯字母</th><th>畀錯錢</th><th>難度</th></tr>' + rows + '</table>'
        : '<p>未有記錄，玩完一關就會有。</p>') +
      (statRows ? '<h2 style="margin-top:16px">每個字母 / 號碼</h2><p>錯得多嘅排前面，可以喺日常多指俾佢睇（車牌、車位、𨋢掣）。</p><table><tr><th>項目</th><th>啱</th><th>錯</th></tr>' + statRows + '</table>' : '') +
      '<button id="parentClose">關閉</button></div>';
    panel.hidden = false;
    document.getElementById('parentClose').onclick = () => { panel.hidden = true; };
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000 || 0);
    last = now;
    const home = ['splash', 'title', 'garage'].includes(g.m.phase);
    clock.tick(!paused && panel.hidden && !home);
    const blocked = paused || document.hidden || clock.blocked || clock.dialogOpen;
    if (blocked && g.drag) { g.drag = null; g.hover = -1; }
    if ((clock.blocked || clock.dialogOpen) && holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    if (blocked !== audioPaused) { ParkAudio.pause(blocked); audioPaused = blocked; }
    // 拖紧车嘅时候唔计「冇动静」：佢喺度谂紧
    if (g.drag) g.m.idle = 0;
    if (!blocked && panel.hidden) { g.update(dt); flush(); }
    ParkRender.draw(c, g);
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  window.__park = g;   // 浏览器验收脚本读状态用
  window.__parkTime = clock;
  requestAnimationFrame(frame);
})();

</script>
