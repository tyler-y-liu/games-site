<script>
(function () {
  'use strict';

  function roundRect(ctx, x, y, w, h, r) {
    var radius = Math.max(0, Math.min(r || 0, Math.abs(w) / 2, Math.abs(h) / 2));
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.lineTo(x + w - radius, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
    ctx.lineTo(x + w, y + h - radius);
    ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
    ctx.lineTo(x + radius, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
    ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y);
    ctx.closePath();
  }

  function railPath(ctx, points, offset) {
    ctx.beginPath();
    for (var i = 0; i < points.length; i += 1) {
      var p = points[i];
      var x = p.x - Math.sin(p.heading) * offset;
      var y = p.y + Math.cos(p.heading) * offset;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  function track(ctx, points, options) {
    options = options || {};
    if (!points || points.length === 0) return;
    var ghost = !!(options.ghost || options.Ghost);
    var highlight = !!(options.highlight || options.selected);
    ctx.save();
    try {
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      if (ghost) ctx.setLineDash([8, 8]);

      if (highlight) {
        ctx.strokeStyle = '#F6E7A1';
        ctx.lineWidth = 3;
        railPath(ctx, points, -11);
        railPath(ctx, points, 11);
      }

      if (!ghost) {
        ctx.strokeStyle = '#8B654D';
        ctx.lineWidth = 7;
        ctx.beginPath();
        for (var i = 0; i < points.length; i += 3) {
          var p = points[i];
          var nx = -Math.sin(p.heading);
          var ny = Math.cos(p.heading);
          ctx.moveTo(p.x - nx * 10, p.y - ny * 10);
          ctx.lineTo(p.x + nx * 10, p.y + ny * 10);
        }
        ctx.stroke();
      }

      ctx.strokeStyle = ghost ? '#B8C9B6' : '#667873';
      ctx.lineWidth = 4;
      railPath(ctx, points, -7);
      railPath(ctx, points, 7);
    } finally {
      if (ghost) ctx.setLineDash([]);
      ctx.restore();
    }
  }

  function arcGlyph(rect, cx, cy, radius, start, direction) {
    var points = [];
    var steps = 28;
    var w = rect.w == null ? rect.width : rect.w;
    var h = rect.h == null ? rect.height : rect.h;
    for (var i = 0; i <= steps; i += 1) {
      var angle = start + direction * (Math.PI / 2) * (i / steps);
      points.push({
        x: rect.x + (cx + Math.cos(angle) * radius) * w,
        y: rect.y + (cy + Math.sin(angle) * radius) * h,
        heading: Math.atan2(
          Math.cos(angle) * direction * h,
          -Math.sin(angle) * direction * w
        )
      });
    }
    return points;
  }

  function pieceGlyph(ctx, shape, rect, options) {
    options = options || {};
    var w = rect.w == null ? rect.width : rect.w;
    var h = rect.h == null ? rect.height : rect.h;
    var points;
    if (shape === 'WN') {
      points = arcGlyph(rect, 0.15, 0.15, 0.35, Math.PI / 2, -1);
    } else if (shape === 'WS') {
      points = arcGlyph(rect, 0.15, 0.85, 0.35, -Math.PI / 2, 1);
    } else {
      points = [];
      for (var i = 0; i <= 28; i += 1) {
        points.push({
          x: rect.x + (0.15 + 0.7 * (i / 28)) * w,
          y: rect.y + 0.5 * h,
          heading: 0
        });
      }
    }
    var drawOptions = {
      ghost: !!(options.ghost || options.Ghost),
      highlight: !!(options.highlight || options.selected)
    };
    if (this && typeof this.track === 'function') {
      this.track(ctx, points, drawOptions);
    } else if (window.TrainArt && typeof window.TrainArt.track === 'function') {
      window.TrainArt.track(ctx, points, drawOptions);
    }
  }

  window.TrackArt = {
    roundRect: roundRect,
    track: track,
    pieceGlyph: pieceGlyph
  };
}());

</script>
<script>
(function () {
  'use strict';
  const INK = '#244A46';
  const PAPER = '#FFF9EC';

  function rr(ctx, x, y, w, h, r) {
    const q = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + q, y); ctx.lineTo(x + w - q, y); ctx.quadraticCurveTo(x + w, y, x + w, y + q);
    ctx.lineTo(x + w, y + h - q); ctx.quadraticCurveTo(x + w, y + h, x + w - q, y + h);
    ctx.lineTo(x + q, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - q);
    ctx.lineTo(x, y + q); ctx.quadraticCurveTo(x, y, x + q, y); ctx.closePath();
  }

  function dot(ctx, x, y, r, color, outlined) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
    if (outlined) { ctx.strokeStyle = INK; ctx.stroke(); }
  }

  function cloud(ctx, x, y, scale) {
    ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
    ctx.beginPath(); ctx.moveTo(-36, 13); ctx.bezierCurveTo(-47, 2, -34, -10, -22, -7);
    ctx.bezierCurveTo(-20, -27, 9, -29, 15, -10); ctx.bezierCurveTo(35, -17, 47, 1, 36, 13); ctx.closePath();
    ctx.fillStyle = PAPER; ctx.fill(); ctx.restore();
  }

  function tree(ctx, x, y, scale, leaf) {
    ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale); ctx.lineWidth = 3;
    rr(ctx, -5, -25, 10, 29, 4); ctx.fillStyle = '#A87955'; ctx.fill(); ctx.strokeStyle = INK; ctx.stroke();
    dot(ctx, -14, -35, 21, leaf, true);
    dot(ctx, 13, -38, 23, leaf, true);
    dot(ctx, 0, -56, 25, leaf, true);
    dot(ctx, -8, -62, 6, '#CBEA9B'); ctx.restore();
  }

  function flower(ctx, x, y, color) {
    ctx.strokeStyle = '#397B62'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y + 3); ctx.lineTo(x - 1, y + 14); ctx.stroke();
    for (let i = 0; i < 4; i += 1) {
      const a = i * Math.PI / 2;
      dot(ctx, x + Math.cos(a) * 4, y + Math.sin(a) * 4, 3.5, color);
    }
    dot(ctx, x, y, 2.5, '#FFD76A');
  }

  function background(ctx, level, time, reducedMotion) {
    ctx.save();
    const scene = Math.max(1, Math.min(3, (Math.round(level) || 0) + 1));
    const t = reducedMotion ? 0 : (time || 0) / 1000; const shift = (scene - 2) * 13;
    ctx.fillStyle = '#DDF3F2'; ctx.fillRect(0, 0, 960, 472);
    dot(ctx, 830 - scene * 13, 70, 32, '#FFE6A0');
    cloud(ctx, 320 + Math.sin(t * 0.18) * 6, 84, 1.05);
    cloud(ctx, 560 + Math.sin(t * 0.14 + 2) * 5, 120, 0.75);
    cloud(ctx, 664 + Math.sin(t * 0.16 + 4) * 6, 176 + scene * 8, 0.9);
    ctx.fillStyle = '#A9D685';
    ctx.beginPath(); ctx.moveTo(0, 275);
    ctx.bezierCurveTo(135, 205 + shift, 265, 297, 405, 241);
    ctx.bezierCurveTo(580, 176 - shift, 760, 283, 960, 215 + shift); ctx.lineTo(960, 472); ctx.lineTo(0, 472); ctx.fill();
    ctx.fillStyle = '#6FB276';
    ctx.beginPath(); ctx.moveTo(0, 330);
    ctx.bezierCurveTo(160, 270 - shift, 285, 350, 450, 301);
    ctx.bezierCurveTo(635, 250 + shift, 790, 346, 960, 283); ctx.lineTo(960, 472); ctx.lineTo(0, 472); ctx.fill();
    ctx.beginPath(); ctx.ellipse(360, 438, 105, 34, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#79C6D0'; ctx.fill();
    ctx.beginPath(); ctx.ellipse(360, 438, 91, 25, 0, 0, Math.PI * 2);
    ctx.strokeStyle = '#C8EEE5'; ctx.lineWidth = 3; ctx.stroke();
    dot(ctx, 320, 432, 11, '#8FD3B5'); ctx.strokeStyle = '#C8EEE5'; ctx.stroke();
    dot(ctx, 392, 444, 8, '#8FD3B5'); ctx.stroke();
    const leaves = ['#76BA78', '#69B985', '#83BC70'];
    tree(ctx, 74, 270, 0.88, leaves[scene - 1]);
    tree(ctx, 139, 251, 0.65, leaves[3 - scene]);
    tree(ctx, 862, 259, 0.94, leaves[scene - 1]);
    tree(ctx, 806, 242, 0.6, leaves[3 - scene]);
    dot(ctx, 36, 288, 15, '#599E6A'); dot(ctx, 52, 290, 12, '#74B776');
    dot(ctx, 909, 285, 15, '#599E6A'); dot(ctx, 892, 290, 11, '#83C181');
    const petals = ['#F2765B', '#F5C75D', '#ED94AA'];
    flower(ctx, 96, 294, petals[scene - 1]); flower(ctx, 117, 306, '#FFF0C2');
    flower(ctx, 838, 303, petals[3 - scene]); flower(ctx, 880, 311, '#FFF0C2');
    flower(ctx, 913, 300, petals[scene - 1]); ctx.restore();
  }

  function station(ctx, x, y, heading, kind, time) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(heading || 0); ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.lineWidth = 3;
    if (kind === 'start') {
      rr(ctx, -38, -60, 70, 52, 7); ctx.fillStyle = '#FFF1CF'; ctx.fill(); ctx.strokeStyle = INK; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-48, -56); ctx.lineTo(-10, -87); ctx.lineTo(43, -56); ctx.closePath();
      ctx.fillStyle = '#F2765B'; ctx.fill(); ctx.stroke();
      rr(ctx, -29, -77, 12, 21, 3); ctx.fillStyle = '#FFF1CF'; ctx.fill(); ctx.stroke();
      rr(ctx, -2, -39, 19, 31, 5); ctx.fillStyle = '#64AFA0'; ctx.fill(); ctx.stroke();
      dot(ctx, 11, -24, 2, '#FFE080');
      rr(ctx, -29, -47, 18, 17, 5); ctx.fillStyle = '#FFD86A'; ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-20, -46); ctx.lineTo(-20, -31); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-8, -6); ctx.lineTo(23, -6); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(0, -91); ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(0, -91); ctx.strokeStyle = '#F8E7BF'; ctx.lineWidth = 2; ctx.stroke();
      dot(ctx, 0, -94, 5, '#FFD66B', true);
      const wave = Math.sin((time || 0) / 1000 * 3) * 2;
      ctx.beginPath(); ctx.moveTo(3, -86); ctx.quadraticCurveTo(25, -94 + wave, 45, -82);
      ctx.lineTo(39, -65); ctx.quadraticCurveTo(22, -76 + wave, 3, -69); ctx.closePath();
      ctx.fillStyle = '#F2765B'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.stroke();
      rr(ctx, -14, -9, 28, 8, 4); ctx.fillStyle = '#FFF1CF'; ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }

  function wheel(ctx, x, y, r) {
    dot(ctx, x, y, r, INK); dot(ctx, x, y, r * 0.53, '#C9E3D5'); dot(ctx, x, y, r * 0.19, '#FFF4D6');
  }

  function train(ctx, cars, time, options = {}) {
    ctx.save(); options = options || {};
    if (!cars || !cars.length) { ctx.restore(); return; }
    for (let i = cars.length - 1; i >= 0; i -= 1) {
      const car = cars[i];
      ctx.save(); ctx.translate(car.x, car.y); ctx.rotate(car.heading || 0); ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-48, 7); ctx.lineTo(-36, 7); ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.stroke();
      if (i === 0) {
        rr(ctx, -40, -4, 82, 19, 6); ctx.fillStyle = '#F2765B'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.stroke();
        rr(ctx, -36, -43, 35, 41, 7); ctx.fillStyle = '#315575'; ctx.fill(); ctx.stroke();
        rr(ctx, -29, -35, 19, 17, 4); ctx.fillStyle = '#FFD86A'; ctx.fill(); ctx.stroke();
        rr(ctx, -43, -49, 48, 9, 4); ctx.fillStyle = '#F2765B'; ctx.fill(); ctx.stroke();
        rr(ctx, -5, -24, 46, 23, 10); ctx.fillStyle = '#F2765B'; ctx.fill(); ctx.stroke();
        rr(ctx, 16, -42, 13, 23, 3); ctx.fillStyle = '#315575'; ctx.fill(); ctx.stroke();
        rr(ctx, 12, -46, 21, 7, 3); ctx.fillStyle = '#F2765B'; ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(39, 5); ctx.lineTo(49, 14); ctx.lineTo(31, 14); ctx.closePath(); ctx.fillStyle = '#F2765B'; ctx.fill(); ctx.stroke();
        dot(ctx, 38, -13, 5, '#FFE080', true);
        wheel(ctx, -25, 17, 10); wheel(ctx, 1, 17, 10); wheel(ctx, 28, 17, 10);
        if (options.horn) {
          for (let p = 0; p < 3; p += 1) {
            const drift = options.reducedMotion ? 0 : Math.sin((time || 0) / 1000 * 4 + p) * 2;
            dot(ctx, 23 + p * 7 + drift, -58 - p * 13, 6 + p * 2, PAPER, true);
          }
        }
      } else {
        rr(ctx, -39, -34, 76, 42, 9); ctx.fillStyle = '#58B7A4'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.stroke();
        rr(ctx, -43, -40, 84, 10, 5); ctx.fillStyle = '#8FD3B5'; ctx.fill(); ctx.stroke();
        rr(ctx, -28, -25, 20, 17, 5); ctx.fillStyle = '#FFE080'; ctx.fill(); ctx.stroke();
        rr(ctx, 6, -25, 20, 17, 5); ctx.fillStyle = '#FFE080'; ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-34, 1); ctx.lineTo(32, 1); ctx.stroke();
        wheel(ctx, -24, 17, 10); wheel(ctx, 23, 17, 10);
      }
      ctx.restore();
    }
    ctx.restore();
  }

  window.SceneArt = { background, station, train };
}());

</script>
<script>
(function () {
  'use strict';

  const INK = '#244A46';

  function animal(ctx, kind, x, y, scale = 1, pose = {}) {
    if (typeof pose === 'string') pose = { mode: pose };
    const mode = pose.mode || 'idle';
    const fur = { rabbit: '#FFF7E9', dog: '#D6A253', cat: '#F2A33C', bear: '#986747', squirrel: '#C87842', fox: '#ED8238' }[kind] || '#D6A253';
    const hop = pose.jump ? 12 : mode === 'celebrate' ? 6 : 0;
    const wave = pose.wave || mode === 'celebrate';
    ctx.save();
    ctx.translate(x, y - hop * scale);
    ctx.scale(scale, scale);
    ctx.globalAlpha *= pose.alpha == null ? 1 : pose.alpha;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = INK;
    function oval(px, py, rx, ry, color, angle = 0) {
      ctx.beginPath();
      ctx.ellipse(px, py, rx, ry, angle, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.stroke();
    }
    function shape(color) {
      ctx.fillStyle = color;
      ctx.fill();
      ctx.stroke();
    }
    switch (kind) {
      case 'rabbit':
        oval(-6.5, -43, 4.2, 11, fur, -0.16);
        oval(6.5, -43, 4.2, 11, fur, 0.16);
        oval(-6.5, -43, 1.5, 7, '#EDBDB4', -0.16);
        oval(6.5, -43, 1.5, 7, '#EDBDB4', 0.16);
        break;
      case 'dog':
        ctx.beginPath();
        ctx.moveTo(-11, -35); ctx.quadraticCurveTo(-21, -34, -16, -20);
        ctx.quadraticCurveTo(-10, -17, -8, -30); shape('#A9723B');
        ctx.beginPath();
        ctx.moveTo(11, -35); ctx.quadraticCurveTo(21, -34, 16, -20);
        ctx.quadraticCurveTo(10, -17, 8, -30); shape('#A9723B');
        break;
      case 'cat':
      case 'fox':
        ctx.beginPath();
        ctx.moveTo(-12, -32); ctx.lineTo(-11, -45); ctx.lineTo(-3, -37);
        ctx.lineTo(3, -37); ctx.lineTo(11, -45); ctx.lineTo(12, -32); shape(fur);
        break;
      case 'bear':
        oval(-10, -36, 5.5, 5.5, fur);
        oval(10, -36, 5.5, 5.5, fur);
        break;
      case 'squirrel':
        ctx.beginPath();
        ctx.moveTo(-7, -8); ctx.bezierCurveTo(-31, -2, -34, -31, -19, -34);
        ctx.bezierCurveTo(-7, -37, -10, -21, -18, -21);
        ctx.bezierCurveTo(-25, -19, -21, -9, -7, -8); shape('#B96839');
        oval(-9, -36, 4, 5, fur, -0.3);
        oval(9, -36, 4, 5, fur, 0.3);
        break;
    }
    if (kind === 'fox') {
      ctx.beginPath();
      ctx.moveTo(7, -10); ctx.bezierCurveTo(31, -3, 34, -23, 18, -27);
      ctx.bezierCurveTo(25, -16, 13, -20, 7, -10); shape(fur);
      ctx.beginPath();
      ctx.moveTo(18, -27); ctx.quadraticCurveTo(29, -25, 28, -17);
      ctx.quadraticCurveTo(24, -20, 20, -17); ctx.quadraticCurveTo(23, -23, 18, -27);
      ctx.fillStyle = '#FFF7E9'; ctx.fill();
    }
    oval(0, -13, mode === 'riding' ? 11 : 10, 13, fur);
    oval(-6, -2, 5, 3, fur);
    oval(6, -2, 5, 3, fur);
    ctx.beginPath();
    if (wave) {
      ctx.moveTo(7, -19); ctx.quadraticCurveTo(17, -23, 15, -34);
      ctx.moveTo(15, -34); ctx.lineTo(12, -38); ctx.moveTo(15, -34); ctx.lineTo(19, -37);
    } else if (mode === 'riding' || mode === 'boarding') {
      ctx.moveTo(-8, -17); ctx.lineTo(-15, -13); ctx.moveTo(8, -17); ctx.lineTo(15, -13);
    } else {
      ctx.moveTo(-8, -17); ctx.lineTo(-12, -10); ctx.moveTo(8, -17); ctx.lineTo(12, -10);
    }
    ctx.stroke();
    oval(0, -28, 14, 12, fur);
    if (kind === 'fox') {
      ctx.beginPath();
      ctx.ellipse(-5, -25, 6, 5, -0.2, 0, Math.PI * 2);
      ctx.ellipse(5, -25, 6, 5, 0.2, 0, Math.PI * 2);
      ctx.fillStyle = '#FFF7E9'; ctx.fill();
    }
    if (kind === 'cat') {
      ctx.beginPath();
      ctx.moveTo(-10, -25); ctx.lineTo(-18, -27); ctx.moveTo(-10, -22); ctx.lineTo(-18, -21);
      ctx.moveTo(10, -25); ctx.lineTo(18, -27); ctx.moveTo(10, -22); ctx.lineTo(18, -21);
      ctx.lineWidth = 1.4; ctx.stroke(); ctx.lineWidth = 2;
    }
    ctx.fillStyle = '#172E2B';
    ctx.beginPath(); ctx.ellipse(-5, -29, 1.5, 2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(5, -29, 1.5, 2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, -24.5, 2, 1.6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, -23); ctx.quadraticCurveTo(-2, -19.5, -5, -21.5);
    ctx.moveTo(0, -23); ctx.quadraticCurveTo(2, -19.5, 5, -21.5);
    ctx.lineWidth = 1.5; ctx.stroke();
    ctx.restore();
  }

  function icon(ctx, type, cx, cy, size, options = {}) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(size / 24, size / 24);
    ctx.strokeStyle = options.color || INK;
    ctx.fillStyle = options.color || INK;
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.globalAlpha *= options.alpha == null ? 1 : options.alpha;
    ctx.beginPath();
    // 大三角箭头：tip 为箭尖，dx/dy 需为单位向量方向
    function arrowHead(tipX, tipY, dx, dy) {
      const len = 9.2;
      const half = 4.6;
      const nx = -dy;
      const ny = dx;
      ctx.beginPath();
      ctx.moveTo(tipX, tipY);
      ctx.lineTo(tipX - dx * len + nx * half, tipY - dy * len + ny * half);
      ctx.lineTo(tipX - dx * len - nx * half, tipY - dy * len - ny * half);
      ctx.closePath();
      ctx.fill();

    if (type === 'horn') {

      ctx.strokeStyle = INK;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-12, -3.5); ctx.lineTo(-4, -3.5); ctx.lineTo(7, -9.5);
      ctx.lineTo(7, 9.5); ctx.lineTo(-4, 3.5); ctx.lineTo(-12, 3.5); ctx.closePath();
      ctx.fillStyle = '#F2765B'; ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-9, 3.5); ctx.lineTo(-9, 10); ctx.lineTo(-4.5, 10); ctx.lineTo(-4.5, 3.5);
      ctx.fillStyle = '#F2765B'; ctx.fill(); ctx.stroke();
      // 右前方 2 道短声弧，深色细线
      ctx.beginPath();
      ctx.lineWidth = 2;
      ctx.moveTo(10.5, -6.2); ctx.quadraticCurveTo(13.6, 0, 10.5, 6.2);
      ctx.moveTo(13.6, -9.2); ctx.quadraticCurveTo(17.4, 0, 13.6, 9.2);

  function routePointer(type, point, pointerId) {
    switch (type) {
      case 'down':
        pointerDown(point, pointerId);
        break;
      case 'move':
        pointerMove(point, pointerId);
        break;
      case 'up':
        pointerUp(point, pointerId);
        break;
      case 'cancel':
        pointerCancel(pointerId);
        break;
      default:
        break;
    }
  }

  function onPointerEvent(event) {
    const type = event.type.slice('pointer'.length);
    const isMouseSecondary = event.pointerType === 'mouse' &&
      ((type === 'down' && event.button !== 0) || event.isPrimary === false);
    if (isMouseSecondary) return;

    // A non-primary touch is ignored even if the first touch began elsewhere.
    if (event.pointerType === 'touch' && event.isPrimary === false) return;
    if (gesture && gesture.pointerId !== event.pointerId) return;

    const point = clientToLogical(event.clientX, event.clientY);
    if ((type === 'down' && !isFrozen() && !gesture) ||
        (gesture && gesture.pointerId === event.pointerId)) {
      event.preventDefault();
    }
    routePointer(type, point, event.pointerId);
  }

  function onKeyDown(event) {
    audioCall('unlock');
    const key = String(event.key || '').toLowerCase();
    const modified = event.ctrlKey || event.metaKey || event.altKey;
    let handled = true;

    if (key === 'm' && !modified) {
      model.setMuted(!stateMuted());
    } else if (!isFrozen() && !modified && key === 'h') {
      model.horn();
    } else if (!isFrozen() && !modified && key === 'u') {
      model.undo();
    } else if (!isFrozen() && !modified && key === 'r') {
      model.replay();
    } else {
      handled = false;
    }

    if (handled) event.preventDefault();
    flushEvents();
  }

  function manualAdvance(ms) {
    const value = Number(ms);
    const dt = Number.isFinite(value) ? Math.max(0, value) : 0;
    model.advance(dt);
    clockMs += dt;
    flushEvents();
    renderer.render(clockMs);
    return model.getState();
  }

  function frame(timeMs) {
    if (isFrozen()) {
      lastTime = 0;
    } else {
      const rawDt = lastTime > 0 ? timeMs - lastTime : 0;
      const dt = Number.isFinite(rawDt) ? Math.min(MAX_DT, Math.max(0, rawDt)) : 0;
      lastTime = Number.isFinite(timeMs) ? timeMs : 0;
      clockMs += dt;
      model.advance(dt);
      flushEvents();
      renderer.render(clockMs);
    }
    window.requestAnimationFrame(frame);
  }

  function testPointer(type, x, y, pointerId = 1) {
    let name = String(type || '').toLowerCase();
    if (name.indexOf('pointer') === 0) name = name.slice('pointer'.length);
    if (name === 'lostpointercapture') name = 'cancel';
    routePointer(name, { x: Number(x), y: Number(y) }, pointerId);
    return model.getState();
  }

  if (!canvas.hasAttribute('tabindex')) canvas.tabIndex = 0;
  renderer.drag = null;

  // Start directly on level one; no menu or intermediate screen.
  model.chooseLevel(0);
  resizeCanvas();
  flushEvents();
  renderer.render(0);

  canvas.addEventListener('pointerdown', onPointerEvent, { passive: false });
  canvas.addEventListener('pointermove', onPointerEvent, { passive: false });
  canvas.addEventListener('pointerup', onPointerEvent, { passive: false });
  canvas.addEventListener('pointercancel', onPointerEvent, { passive: false });
  canvas.addEventListener('lostpointercapture', (event) => {
    cancelGesture(event.pointerId, false);
  });

  window.addEventListener('blur', () => cancelGesture());
  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('resize', renderAfterResize);
  if (window.visualViewport && typeof window.visualViewport.addEventListener === 'function') {
    window.visualViewport.addEventListener('resize', renderAfterResize);
  }

  document.addEventListener('visibilitychange', () => {
    lastTime = 0;
    if (document.hidden) cancelGesture();
    updateAudioVisibility();
    if (!document.hidden) renderer.render(clockMs);
  });

  window.__animalTrain = {
    getState: model.getState.bind(model),
    getGeometry: model.getGeometry.bind(model),
    getHitTargets: model.getHitTargets.bind(model),
    selectPiece: model.selectPiece.bind(model),
    selectGap: model.selectGap.bind(model),
    place: model.place.bind(model),
    drop: model.drop.bind(model),
    undo: model.undo.bind(model),
    horn: model.horn.bind(model),
    setMuted: model.setMuted.bind(model),
    next: model.next.bind(model),
    replay: model.replay.bind(model),
    chooseLevel: model.chooseLevel.bind(model),
    advance: manualAdvance,
    resize: renderAfterResize,
    pointer: testPointer
  };

  lastTime = 0;
  window.requestAnimationFrame(frame);
})();

</script>
</body>
</html>
