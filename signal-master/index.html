<title>紅綠燈站長</title>
<style>
html, body {
  width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
  overscroll-behavior: none; background: #2b323b;
  font-family: "PingFang HK", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}
#stage { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
#cv {
  display: block; touch-action: none; user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
#rotate { display: none; position: fixed; inset: 0; background: #2b323b; align-items: center; justify-content: center; }
#rotate i {
  display: block; width: 90px; height: 150px; border: 8px solid #fff; border-radius: 18px;
  animation: turn 2s ease-in-out infinite;
}
@keyframes turn { 0%, 20% { transform: rotate(0); } 60%, 100% { transform: rotate(90deg); } }
body.portrait #rotate { display: flex; }
#parent {
  position: fixed; inset: 0; background: rgba(30, 36, 44, .6);
  display: flex; align-items: center; justify-content: center;
}
#parent[hidden] { display: none; }
#parent .box {
  background: #fff; border-radius: 20px; padding: 20px 26px; max-width: 640px; width: 86%;
  max-height: 86%; overflow: auto; color: #2b323b;
}
#parent h2 { margin: 0 0 6px; }
#parent p { margin: 0 0 12px; font-size: 14px; color: #5b6470; }
#parent table { width: 100%; border-collapse: collapse; font-size: 15px; }
#parent th, #parent td { padding: 6px 8px; border-bottom: 1px solid #e3e6ea; text-align: left; }
#parent button {
  margin-top: 14px; padding: 10px 26px; border: 0; border-radius: 12px;
  background: #00a59b; color: #fff; font-size: 16px; font-weight: 700;
}

</style>

<script>
'use strict';
// 纯逻辑：不碰 DOM / canvas / 音频，Node 里可以直接跑（见 signal-master.test.js）。
const SignalModel = (() => {
  const ANIMALS = ['rabbit', 'cat', 'dog', 'panda', 'chick', 'frog', 'pig'];
  // 车厂：头两款一开始就有，其余每过一关拿一款，越往后越特别
  const LIVERIES = [
    { body: '#f4f6f8', stripe: '#e2231a' }, { body: '#f4f6f8', stripe: '#0075c2' },
    { body: '#f4f6f8', stripe: '#00a040' }, { body: '#f4f6f8', stripe: '#f3982d' },
    { body: '#f4f6f8', stripe: '#a5539a' }, { body: '#f4f6f8', stripe: '#00b2a9' },
    { body: '#fff3c4', stripe: '#8f5b3a' }, { body: '#ffe0ec', stripe: '#ff5fa2' },
    { body: '#dff1ff', stripe: '#3fa9ff', kind: 'dots' }, { body: '#f4f6f8', stripe: '#e2231a', kind: 'rainbow' },
    { body: '#2f3a57', stripe: '#ffe24d', kind: 'night' }, { body: '#ffd24a', stripe: '#c98a00', kind: 'gold' }
  ];
  const START_DEPOT = 2, MAX_SKILL = 3;
  const T = {
    arrive: 1.7, doorClose: 0.6, depart: 1.7,
    lock: 0.9,        // 抢按之后按钮锁这么久——乱拍一通撞不上放行那一下
    hint: 4.5,        // 可以开车了还没按，过这么久才提醒：先让他自己看灯
    hintRepeat: 7,
    introGuard: 0.8,  // 规则卡刚弹出时的点击不算数，免得上一关的连点直接跳过讲解
    newTrain: 3.4     // 过关那句（最长约 2.8 秒）说完再报「得到新列車」；新的一句会掐断旧的，留够余量
  };

  // wait = 灯保持「不能开」的秒数（0 = 一进站就能开，用来养成「按」的惯性，后面的「忍」才有东西可忍）
  // run  = [迟到乘客几秒后出现, 跑多久上车]；opp = 这班车按相反规则（绿灯等、红灯开）
  const LEVELS = [
    { key: 'light', trials: [
      { wait: 2.2 }, { wait: 0 }, { wait: 3.2 }, { wait: 1.4 }, { wait: 0 }, { wait: 4.2 }] },
    { key: 'runner', trials: [
      { wait: 0, run: [0.3, 2.6] },    // 绿灯 + 有人在跑：这一关要忍的就是这个
      { wait: 2.0 },
      { wait: 1.2, run: [0.8, 2.8] },  // 人还在跑，灯先转绿
      { wait: 0, run: [0.3, 3.4] },
      { wait: 3.0, run: [0.2, 1.6] },  // 人先上车，灯后转绿
      { wait: 0 },
      { wait: 1.6, run: [1.2, 2.6] }] },
    { key: 'opposite', trials: [
      { wait: 2.4 }, { wait: 0 }, { wait: 3.4 }, { wait: 1.5 }, { wait: 0 }, { wait: 4.0 }, { wait: 2.0 }
    ].map(t => Object.assign({ opp: true }, t)) },
    // 规则在同一关里来回变：顺序是设计好的（换得越来越密），所以不打乱
    { key: 'mix', fixed: true, trials: [
      { wait: 2.2 }, { wait: 0 },
      { wait: 2.6, opp: true }, { wait: 0, opp: true },
      { wait: 2.4 },
      { wait: 3.0, opp: true },
      { wait: 2.0 },
      { wait: 2.8, opp: true }] }
  ];
  // 过关允许的失手次数：6 班车错 1 次、7 班以上错 2 次
  const need = n => n - (n >= 7 ? 2 : 1);

  function create(rng) {
    rng = rng || Math.random;
    const m = {
      phase: 'splash', level: 0, ti: 0, t: 0, trials: [], trial: null, opp: false,
      lightGo: false, ready: false, readyAt: 0, hintAt: 0, lock: 0, early: 0, earlyTotal: 0,
      runner: 'none', runP: 0, aboard: [], stars: [], rts: [], passed: false,
      unlocked: 0, best: LEVELS.map(() => 0), skill: LEVELS.map(() => 0),
      depot: START_DEPOT, newTrain: -1, newSaid: true,
      events: [], goodN: 0, livery: 0, pressAt: -9, time: 0
    };
    const emit = (t, name, data) => m.events.push({ t, name, data });

    function buildTrials(level) {
      const L = LEVELS[level], src = L.trials;
      // 第一班固定用来示范规则，其余打乱；等待时间加点抖动，背不下节奏
      const rest = src.slice(1);
      if (!L.fixed) for (let i = rest.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [rest[i], rest[j]] = [rest[j], rest[i]];
      }
      // 上一轮一次都没抢按，这一轮就等得更久一点；抢得多就放短
      const k = 1 + 0.25 * m.skill[level];
      return [src[0]].concat(rest).map((s, i) => {
        const pool = ANIMALS.slice();
        const take = () => pool.splice(Math.floor(rng() * pool.length), 1)[0];
        return {
          wait: s.wait > 0 ? s.wait * k + (i > 0 ? (rng() - 0.5) * 0.6 : 0) : 0,
          run: s.run ? [s.run[0], s.run[1] * (1 + 0.12 * m.skill[level])] : null,
          opp: !!s.opp,
          runnerId: s.run ? take() : null,
          // 没有迟到乘客的车坐满三个窗；有的话留一个窗给他
          seats: s.run ? [take(), take()] : [take(), take(), take()],
          livery: Math.floor(rng() * m.depot)
        };
      });
    }

    function selectLevel(i) {
      if (i < 0 || i > m.unlocked || i >= LEVELS.length) return false;
      const trials = buildTrials(i);
      Object.assign(m, { phase: 'intro', level: i, t: 0, ti: 0, trials, opp: trials[0].opp,
        stars: [], rts: [], earlyTotal: 0, passed: false, trial: null, newTrain: -1, newSaid: true });
      emit('voice', 'l' + (i + 1) + '_intro');
      return true;
    }

    function startTrial() {
      const tr = m.trials[m.ti], switched = m.ti > 0 && tr.opp !== m.opp;
      Object.assign(m, { phase: 'arrive', t: 0, trial: tr, opp: tr.opp, lightGo: false, ready: false,
        lock: 0, early: 0, runner: tr.run ? 'pending' : 'none', runP: 0,
        aboard: tr.seats.slice(), livery: tr.livery });
      emit('sfx', 'arrive');
      if (switched) { emit('sfx', 'pop'); emit('voice', tr.opp ? 'sw_opp' : 'sw_norm'); }
    }

    function waitVoice() {
      if (m.runner === 'pending' || m.runner === 'running') return 'l2_wait';
      return m.opp ? 'l3_wait' : 'l1_wait';
    }
    const goVoice = () => m.level === 1 ? 'l2_go' : m.opp ? 'l3_go' : 'l1_go';

    function setReady() {
      m.ready = true; m.readyAt = m.t; m.hintAt = m.t + T.hint;
    }

    function enterDwell() {
      const tr = m.trial;
      m.phase = 'dwell'; m.t = 0;
      m.lightGo = tr.wait <= 0;
      emit('sfx', 'doors');
      if (m.lightGo && m.runner === 'none') setReady();
      // 每关头一班车把「现在要等」说出来，之后不再提醒，靠他自己看
      else if (m.ti === 0 && !tr.run) emit('voice', waitVoice());
    }

    function finishTrial() {
      m.stars.push(m.early === 0);
      m.ti++;
      if (m.ti < m.trials.length) return startTrial();
      const got = m.stars.filter(Boolean).length, lv = m.level;
      m.passed = got >= need(m.trials.length);
      m.best[lv] = Math.max(m.best[lv], got);
      const skill = m.skill[lv];
      if (m.earlyTotal === 0) m.skill[lv] = Math.min(MAX_SKILL, skill + 1);
      else if (m.earlyTotal >= 3) m.skill[lv] = Math.max(0, skill - 1);
      if (m.passed) {
        m.unlocked = Math.max(m.unlocked, Math.min(LEVELS.length - 1, lv + 1));
        if (m.depot < LIVERIES.length) { m.newTrain = m.depot++; m.newSaid = false; }
      }
      m.phase = 'levelDone'; m.t = 0;
      // 變變變结算时回到平常的样子：别让夸奖画面还戴着「相反」的帽子
      if (LEVELS[lv].key === 'mix') m.opp = false;
      emit('sfx', m.passed ? 'fanfare' : 'soft');
      emit('voice', !m.passed ? 'retry' : lv === LEVELS.length - 1 ? 'finale' : 'done');
      emit('log', null, {
        level: lv, trains: m.trials.length, stars: got, early: m.earlyTotal, passed: m.passed, skill,
        rt: m.rts.length ? +(m.rts.reduce((a, b) => a + b, 0) / m.rts.length).toFixed(2) : null
      });
    }

    // 大按钮
    function press() {
      if (m.phase !== 'dwell' || m.lock > 0) return false;
      m.pressAt = m.time;
      if (m.ready) {
        m.rts.push(m.t - m.readyAt);
        m.phase = 'depart'; m.t = 0;
        emit('sfx', 'go');
        if (m.early === 0) { emit('sfx', 'star'); emit('voice', 'good' + (m.goodN++ % 3 + 1)); }
        return true;
      }
      m.early++; m.earlyTotal++; m.lock = T.lock;
      emit('sfx', 'buzz');
      if (m.early === 1) emit('voice', m.level === 0 ? 'early' : waitVoice());
      return false;
    }

    // 画面其它位置的「继续」：开场、规则卡
    function advance() {
      if (m.phase === 'splash') { m.phase = 'title'; m.t = 0; emit('voice', 'hello'); return true; }
      if (m.phase === 'intro' && m.t >= T.introGuard) { startTrial(); return true; }
      return false;
    }
    function next() {
      if (m.phase !== 'levelDone' || !m.passed || m.level >= LEVELS.length - 1) return false;
      return selectLevel(m.level + 1);
    }
    function replay() { return m.phase === 'levelDone' && selectLevel(m.level); }
    function openDepot() {
      if (m.phase !== 'title') return false;
      m.phase = 'depot'; m.t = 0;
      return true;
    }
    function home() {
      if (m.phase === 'splash' || m.phase === 'title') return false;
      m.phase = 'title'; m.t = 0; m.trial = null;
      emit('voice', null);
      return true;
    }

    function update(dt) {
      m.time += dt; m.t += dt;
      if (m.lock > 0) m.lock = Math.max(0, m.lock - dt);
      if (m.phase === 'arrive') {
        if (m.t >= T.arrive) enterDwell();
      } else if (m.phase === 'dwell') {
        const tr = m.trial;
        if (!m.lightGo && m.t >= tr.wait) { m.lightGo = true; emit('sfx', 'ding'); }
        if (m.runner === 'pending' && m.t >= tr.run[0]) {
          m.runner = 'running'; emit('voice', 'runner');
        }
        if (m.runner === 'running') {
          m.runP = Math.min(1, (m.t - tr.run[0]) / tr.run[1]);
          if (m.runP >= 1) { m.runner = 'aboard'; m.aboard.push(tr.runnerId); emit('sfx', 'pop'); }
        }
        if (!m.ready && m.lightGo && (m.runner === 'none' || m.runner === 'aboard')) setReady();
        if (m.ready && m.t >= m.hintAt) {
          emit('voice', goVoice());
          m.hintAt += T.hintRepeat;
        }
      } else if (m.phase === 'depart') {
        if (m.t >= T.doorClose + T.depart) finishTrial();
      } else if (m.phase === 'levelDone') {
        if (!m.newSaid && m.t >= T.newTrain) { m.newSaid = true; emit('sfx', 'star'); emit('voice', 'newtrain'); }
      }
    }

    // 灯现在显示什么颜色：相反规则把颜色对调，规则本身（lightGo）不变
    function lightColor() {
      return (m.opp ? !m.lightGo : m.lightGo) ? 'green' : 'red';
    }
    function restore(p) {
      if (!p) return;
      const top = LEVELS.length - 1;
      if (Number.isInteger(p.unlocked)) m.unlocked = Math.max(0, Math.min(top, p.unlocked));
      if (Array.isArray(p.best)) m.best = LEVELS.map((_, i) => p.best[i] | 0);
      if (Array.isArray(p.skill)) m.skill = LEVELS.map((_, i) => Math.max(0, Math.min(MAX_SKILL, p.skill[i] | 0)));
      if (Number.isInteger(p.depot)) m.depot = Math.max(START_DEPOT, Math.min(LIVERIES.length, p.depot));
      // 旧存档（加第四关和车厂之前）只记了 best：按 best 补回该解锁的关和该拿的车
      const passed = LEVELS.map((l, i) => m.best[i] >= need(l.trials.length));
      passed.forEach((ok, i) => { if (ok) m.unlocked = Math.max(m.unlocked, Math.min(top, i + 1)); });
      m.depot = Math.min(LIVERIES.length, Math.max(m.depot, START_DEPOT + passed.filter(Boolean).length));
    }
    const snapshot = () => ({ unlocked: m.unlocked, best: m.best, skill: m.skill, depot: m.depot });

    return { m, T, update, press, advance, selectLevel, next, replay, home, openDepot, lightColor,
      restore, snapshot, need: () => need(m.trials.length) };
  }

  return { create, LEVELS, LIVERIES, ANIMALS, T, need, START_DEPOT, MAX_SKILL };
})();
if (typeof module !== 'undefined') module.exports = SignalModel;

<script>
'use strict';
// 音效全部 Web Audio 合成；人声是内联的 mp3，解码后也走同一个 AudioContext——
// iOS 上只要第一次触摸解锁过 context，之后人声就不用每句都等手势。
const SignalAudio = (() => {
  let ctx = null, master = null, muted = false, voiceNode = null, pending = null;
  const buffers = {};

  function unlock() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = muted ? 0 : 1;
      master.connect(ctx.destination);
      Object.keys(ASSETS.voice).forEach(name => {
        const bin = atob(ASSETS.voice[name]);
        const buf = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
        ctx.decodeAudioData(buf.buffer, b => {
          buffers[name] = b;
          // 第一下触摸既解锁音频又触发第一句话，那时还没解码完——解码好了补播
          if (pending === name) voice(name);
        }, () => {});
      });
    } catch (e) { ctx = null; }
  }

  function setMuted(v) {
    muted = v;
    if (master) master.gain.value = v ? 0 : 1;
  }

  function tone(type, f0, f1, at, dur, vol) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    const t = ctx.currentTime + at;
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }

  function noise(at, dur, freq, vol) {
    const n = Math.floor(ctx.sampleRate * dur);
    const b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    const t = ctx.currentTime + at;
    s.buffer = b; f.type = 'lowpass'; f.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + dur * 0.4);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t);
  }

  const SFX = {
    arrive() { noise(0, 1.6, 420, 0.22); tone('sine', 520, 260, 1.1, 0.5, 0.05); },
    doors() { [0, 0.16, 0.32].forEach(a => tone('sine', 1320, 1320, a, 0.1, 0.12)); },
    ding() { tone('sine', 880, 880, 0, 0.35, 0.22); tone('sine', 1320, 1320, 0.12, 0.5, 0.2); },
    // 抢按的提示要软：是「还没到」，不是「你错了」
    buzz() { tone('triangle', 240, 200, 0, 0.14, 0.2); tone('triangle', 200, 170, 0.17, 0.18, 0.2); },
    pop() { tone('sine', 520, 980, 0, 0.14, 0.2); },
    go() {
      tone('sawtooth', 311, 311, 0, 0.55, 0.07); tone('sawtooth', 370, 370, 0, 0.55, 0.07);
      noise(0.5, 1.7, 700, 0.2);
    },
    star() { [1047, 1319, 1568].forEach((f, i) => tone('triangle', f, f, 0.05 + i * 0.07, 0.22, 0.14)); },
    fanfare() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone('triangle', f, f, i * 0.13, 0.3, 0.18)); },
    soft() { tone('sine', 660, 660, 0, 0.3, 0.15); tone('sine', 523, 523, 0.2, 0.4, 0.15); },
    tap() { tone('sine', 700, 500, 0, 0.06, 0.1); }
  };

  function sfx(name) {
    if (!ctx || !SFX[name]) return;
    try { SFX[name](); } catch (e) { /* 没声音也能玩 */ }
  }

  // 同一时间只说一句：新的一句打断旧的。name 为空 = 只是让它闭嘴
  function voice(name) {
    if (!ctx) return;
    if (voiceNode) { try { voiceNode.stop(); } catch (e) { /* 已经播完 */ } voiceNode = null; }
    const b = name && buffers[name];
    pending = b ? null : name;
    if (!b) return;
    const s = ctx.createBufferSource(), g = ctx.createGain();
    s.buffer = b; g.gain.value = 1.5;
    s.connect(g); g.connect(master);
    s.start();
    voiceNode = s;
  }

  return { unlock, setMuted, sfx, voice, isMuted: () => muted };
})();

<script>
'use strict';
// 画面：逻辑坐标固定 960×540，shell 负责缩放。命中区域也放在这里（Layout），画的和点的用同一份数。
const Layout = {
  W: 960, H: 540,
  train: { x: 110, y: 150, w: 640, h: 200, windows: [70, 285, 500], doors: [140, 355], doorW: 75 },
  lamp: { x: 860, red: 92, green: 164, r: 30 },
  button: { x: 830, y: 446, r: 64 },
  home: { x: 40, y: 40, r: 24 },
  mute: { x: 98, y: 40, r: 24 },
  bear: { x: 196, y: 92, r: 56 },
  splashPlay: { x: 480, y: 330, r: 84 },
  tiles: [0, 1, 2, 3].map(i => ({ x: 50 + i * 223, y: 200, w: 190, h: 250 })),
  depot: { x: 896, y: 92, r: 40 },
  introPlay: { x: 742, y: 404, r: 38 },
  replay: (hasNext) => ({ x: hasNext ? 390 : 480, y: 392, r: 42 }),
  next: { x: 580, y: 392, r: 48 }
};

const SignalRender = (() => {
  const L = Layout;
  const FONT = '"PingFang HK","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif';
  const THEME = [
    { wall: '#cdeee6', tile: '#b5e2d8', band: '#00a59b', floor: '#e9e4d8' },
    { wall: '#ffe9bd', tile: '#f7d995', band: '#f08a24', floor: '#ece5d6' },
    { wall: '#e2d5fb', tile: '#cdbcf3', band: '#8a55c8', floor: '#e6e1ea' }
  ];
  const LEVEL_NAME = ['紅燈等一等', '等埋乘客', '相反遊戲', '變變變'];
  const TILE_BAND = ['#00a59b', '#f08a24', '#8a55c8', '#e0457b'];
  const GHOST = { body: '#dfe3e8', stripe: '#cdd2d8', kind: 'ghost' };
  // 「變變變」沒有自己的牆色：牆跟著當前規則變，和派對帽一起提示「現在是哪一套」
  const themeOf = m => THEME[m.level === 3 ? (m.opp ? 2 : 0) : m.level];
  const imgs = {};

  function load() {
    Object.keys(ASSETS.img).forEach(k => { const im = new Image(); im.src = ASSETS.img[k]; imgs[k] = im; });
  }

  const easeOut = p => 1 - Math.pow(1 - p, 3);
  const easeIn = p => p * p * p;
  const clamp01 = v => Math.max(0, Math.min(1, v));

  function rr(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }
  function head(c, id, x, y, r, ring) {
    const im = imgs[id];
    c.save();
    c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.closePath();
    c.fillStyle = '#fff'; c.fill();
    if (im && im.complete && im.naturalWidth) { c.clip(); c.drawImage(im, x - r, y - r, r * 2, r * 2); }
    c.restore();
    if (ring) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.lineWidth = 4; c.strokeStyle = ring; c.stroke(); }
  }
  function star(c, x, y, r, fill, stroke) {
    c.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * 0.46 : r;
      c.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q);
    }
    c.closePath();
    if (fill) { c.fillStyle = fill; c.fill(); }
    if (stroke) { c.lineWidth = 3; c.strokeStyle = stroke; c.lineJoin = 'round'; c.stroke(); }
  }
  function text(c, s, x, y, size, color, align) {
    c.font = '800 ' + size + 'px ' + FONT;
    c.textAlign = align || 'center'; c.textBaseline = 'middle';
    c.fillStyle = color; c.fillText(s, x, y);
  }
  function roundBtn(c, b, color, pulse) {
    const r = b.r * (1 + (pulse || 0));
    c.beginPath(); c.arc(b.x, b.y + 4, r, 0, Math.PI * 2); c.fillStyle = 'rgba(0,0,0,.18)'; c.fill();
    c.beginPath(); c.arc(b.x, b.y, r, 0, Math.PI * 2); c.fillStyle = color; c.fill();
    c.lineWidth = 4; c.strokeStyle = '#fff'; c.stroke();
    return r;
  }
  function playIcon(c, x, y, s) {
    c.beginPath(); c.moveTo(x - s * 0.38, y - s * 0.55); c.lineTo(x + s * 0.62, y); c.lineTo(x - s * 0.38, y + s * 0.55);
    c.closePath(); c.fillStyle = '#fff'; c.fill();
  }

  function station(c, th, plain) {
    c.fillStyle = th.wall; c.fillRect(0, 0, L.W, 352);
    c.fillStyle = th.tile;
    for (let x = 0; x < L.W; x += 48) for (let y = 34; y < 352; y += 48) if ((x / 48 + (y - 34) / 48) % 2 < 1) c.fillRect(x, y, 48, 48);
    c.fillStyle = '#39424e'; c.fillRect(0, 0, L.W, 14);
    c.fillStyle = th.band; c.fillRect(0, 14, L.W, 20);
    // 站牌：圆 + 横条，不写字
    if (!plain) [300, 660].forEach(x => {
      c.beginPath(); c.arc(x, 96, 30, 0, Math.PI * 2); c.fillStyle = '#fff'; c.fill();
      c.lineWidth = 9; c.strokeStyle = th.band; c.stroke();
      rr(c, x - 46, 87, 92, 18, 5); c.fillStyle = '#39424e'; c.fill();
    });
    // 路轨坑 + 月台
    c.fillStyle = '#4a4f57'; c.fillRect(0, 318, L.W, 40);
    c.fillStyle = th.floor; c.fillRect(0, 352, L.W, L.H - 352);
    c.fillStyle = '#f7c81e'; c.fillRect(0, 362, L.W, 16);
    c.fillStyle = 'rgba(0,0,0,.06)';
    for (let x = 0; x < L.W; x += 120) c.fillRect(x, 378, 3, L.H - 378);
  }

  // 一列车。x,y 是车身左上角；mini 时由调用方先 scale
  function train(c, x, y, lv, aboard, doorOpen, time) {
    const t = L.train, ghost = lv.kind === 'ghost', dark = lv.kind === 'night';
    c.beginPath();
    c.moveTo(x, y + 26); c.arcTo(x, y, x + 26, y, 26);
    c.lineTo(x + t.w - 70, y); c.quadraticCurveTo(x + t.w, y + 10, x + t.w + 6, y + 110);
    c.lineTo(x + t.w + 6, y + t.h); c.lineTo(x, y + t.h); c.closePath();
    c.fillStyle = lv.body; c.fill();
    c.lineWidth = 4; c.strokeStyle = dark ? '#1b2238' : '#8b96a3'; c.stroke();
    if (lv.kind === 'rainbow') ['#e2231a', '#f3982d', '#ffd24a', '#00a040', '#0075c2', '#a5539a'].forEach((col, i) => {
      c.fillStyle = col; c.fillRect(x + 2, y + 130 + i * 5, t.w + 2, 5);
    });
    else { c.fillStyle = lv.stripe; c.fillRect(x + 2, y + 132, t.w + 2, 24); }
    if (lv.kind === 'dots') { c.fillStyle = '#fff'; for (let dx = 22; dx < t.w; dx += 36) { c.beginPath(); c.arc(x + dx, y + 144, 6, 0, Math.PI * 2); c.fill(); } }
    if (dark || lv.kind === 'gold') for (let i = 0; i < 9; i++) star(c, x + 30 + i * 70, y + 16 + (i % 2) * 6, 6, dark ? '#ffe24d' : '#fff8d6');
    c.fillStyle = ghost ? '#cdd2d8' : dark ? '#1b2238' : lv.kind === 'gold' ? '#e0a800' : '#c9d1da';
    c.fillRect(x + 2, y + 178, t.w + 2, 22);
    const glass = ghost ? '#c3c8ce' : '#2f3a47';
    // 车头窗 + 车头灯
    c.beginPath(); c.moveTo(x + t.w - 62, y + 30); c.lineTo(x + t.w - 22, y + 34);
    c.quadraticCurveTo(x + t.w - 6, y + 70, x + t.w - 6, y + 112); c.lineTo(x + t.w - 62, y + 112); c.closePath();
    c.fillStyle = glass; c.fill();
    if (!ghost) head(c, 'bear', x + t.w - 40, y + 78, 24);
    c.beginPath(); c.arc(x + t.w - 8, y + 168, 9, 0, Math.PI * 2); c.fillStyle = ghost ? '#cdd2d8' : '#ffe680'; c.fill();
    // 车窗与乘客
    t.windows.forEach((wx, i) => {
      rr(c, x + wx - 44, y + 34, 88, 88, 16); c.fillStyle = glass; c.fill();
      const id = aboard[i];
      if (id) head(c, id, x + wx, y + 80 + Math.sin(time * 3 + i) * 2, 36);
    });
    // 车门：两扇往两边滑
    const leaf = ghost ? '#d5d9de' : dark ? '#46527a' : '#dfe5ea';
    t.doors.forEach(dx => {
      const X = x + dx, half = t.doorW / 2, gap = half * doorOpen;
      rr(c, X, y + 30, t.doorW, 168, 8); c.fillStyle = '#ffeebd'; c.fill();
      c.strokeStyle = dark ? '#1b2238' : '#8b96a3'; c.lineWidth = 3;
      [[X, half - gap], [X + half + gap, half - gap]].forEach(([dxx, w]) => {
        if (w <= 1) return;
        c.fillStyle = leaf; c.fillRect(dxx, y + 30, w, 168); c.strokeRect(dxx, y + 30, w, 168);
        c.fillStyle = glass; c.fillRect(dxx + w * 0.2, y + 46, w * 0.6, 50);
      });
    });
  }
  function miniTrain(c, x, y, k, lv, aboard, time) {
    c.save(); c.translate(x, y); c.scale(k, k);
    train(c, 0, 0, lv, aboard || [], 0, time || 0);
    c.restore();
  }

  function signal(c, g) {
    const m = g.m, lp = L.lamp, on = m.phase === 'dwell' || m.phase === 'depart' || m.phase === 'arrive';
    const color = on && m.phase !== 'arrive' ? g.lightColor() : null;
    c.fillStyle = '#5b6470'; c.fillRect(lp.x - 7, 200, 14, 160);
    rr(c, lp.x - 46, 44, 92, 170, 22); c.fillStyle = '#2b323b'; c.fill();
    if (m.opp) {
      // 相反规则时给信号灯戴顶派对帽：一眼看出「现在在玩相反」
      c.beginPath(); c.moveTo(lp.x - 26, 46); c.lineTo(lp.x + 26, 46); c.lineTo(lp.x + 6, 8); c.closePath();
      c.fillStyle = '#ff5fa2'; c.fill();
      c.beginPath(); c.arc(lp.x + 6, 9, 7, 0, Math.PI * 2); c.fillStyle = '#ffe24d'; c.fill();
    }
    [['red', lp.red, '#ff3b30', '#5a2523'], ['green', lp.green, '#34d058', '#1f4a2b']].forEach(([k, y, lit, dim]) => {
      const isOn = color === k;
      if (isOn) {
        const gl = c.createRadialGradient(lp.x, y, lp.r * 0.5, lp.x, y, lp.r * 2.4);
        gl.addColorStop(0, lit + 'aa'); gl.addColorStop(1, lit + '00');
        c.fillStyle = gl; c.beginPath(); c.arc(lp.x, y, lp.r * 2.4, 0, Math.PI * 2); c.fill();
      }
      c.beginPath(); c.arc(lp.x, y, lp.r, 0, Math.PI * 2); c.fillStyle = isOn ? lit : dim; c.fill();
      if (isOn) { c.beginPath(); c.arc(lp.x - 9, y - 10, 8, 0, Math.PI * 2); c.fillStyle = 'rgba(255,255,255,.55)'; c.fill(); }
    });
  }

  function runner(c, g) {
    const m = g.m;
    if (m.phase !== 'dwell' || m.runner !== 'running') return;
    const p = m.runP, door = L.train.x + L.train.doors[0] + L.train.doorW / 2;
    const run = clamp01(p / 0.86), hop = clamp01((p - 0.86) / 0.14);
    const x = -50 + (door + 50) * run;
    const s = 1 - hop * 0.3;
    const y = 440 - hop * 120 - Math.abs(Math.sin(m.time * 14)) * 10 * (1 - hop);
    c.save(); c.globalAlpha = 1 - hop * 0.6;
    // 腿
    c.strokeStyle = '#5b4636'; c.lineWidth = 7 * s; c.lineCap = 'round';
    const sw = Math.sin(m.time * 14) * 13 * s;
    c.beginPath(); c.moveTo(x - 8 * s, y + 46 * s); c.lineTo(x - 8 * s + sw, y + 72 * s);
    c.moveTo(x + 8 * s, y + 46 * s); c.lineTo(x + 8 * s - sw, y + 72 * s); c.stroke();
    rr(c, x - 22 * s, y + 14 * s, 44 * s, 38 * s, 14 * s); c.fillStyle = '#ff8a5c'; c.fill();
    head(c, m.trial.runnerId, x, y - 12 * s, 36 * s, '#fff');
    c.restore();
    if (!hop) {
      // 惊叹号气泡
      const by = y - 78 + Math.sin(m.time * 8) * 3;
      c.beginPath(); c.arc(x + 34, by, 17, 0, Math.PI * 2); c.fillStyle = '#fff'; c.fill();
      c.lineWidth = 3; c.strokeStyle = '#ff5a3c'; c.stroke();
      text(c, '!', x + 34, by + 1, 24, '#ff5a3c');
    }
  }

  function button(c, g) {
    const m = g.m, b = L.button;
    const locked = m.lock > 0;
    const sinceHint = m.ready && m.t > m.readyAt + g.T.hint;
    const pressed = m.time - m.pressAt < 0.15;
    const sx = locked ? Math.sin(m.time * 50) * 5 * (m.lock / g.T.lock) : 0;
    const pulse = sinceHint ? (Math.sin(m.time * 6) + 1) * 0.04 : 0;
    c.beginPath(); c.ellipse(b.x + sx, b.y + 22, b.r * 1.16, b.r * 0.9, 0, 0, Math.PI * 2); c.fillStyle = '#39424e'; c.fill();
    const r = b.r * (1 + pulse), y = b.y + (pressed || locked ? 8 : 0);
    c.beginPath(); c.arc(b.x + sx, y + 8, r, 0, Math.PI * 2); c.fillStyle = locked ? '#8d949c' : '#c98a00'; c.fill();
    c.beginPath(); c.arc(b.x + sx, y, r, 0, Math.PI * 2); c.fillStyle = locked ? '#b9bfc6' : '#ffc928'; c.fill();
    c.beginPath(); c.arc(b.x + sx - r * 0.3, y - r * 0.35, r * 0.22, 0, Math.PI * 2); c.fillStyle = 'rgba(255,255,255,.5)'; c.fill();
    playIcon(c, b.x + sx, y, r * 0.62);
  }

  function hud(c, g) {
    const m = g.m;
    roundBtn(c, L.home, '#5b6470');
    c.fillStyle = '#fff';
    c.beginPath(); c.moveTo(L.home.x, L.home.y - 13); c.lineTo(L.home.x + 14, L.home.y); c.lineTo(L.home.x - 14, L.home.y); c.closePath(); c.fill();
    c.fillRect(L.home.x - 9, L.home.y, 18, 11);
    mute(c, g);
    m.trials.forEach((_, i) => {
      const x = 156 + i * 38, y = 40;
      if (i < m.stars.length) {
        if (m.stars[i]) star(c, x, y, 16, '#ffc928', '#b97f00');
        else { c.beginPath(); c.arc(x, y, 8, 0, Math.PI * 2); c.fillStyle = '#aab2bb'; c.fill(); }
      } else star(c, x, y, 16, 'rgba(255,255,255,.75)', i === m.stars.length ? '#39424e' : '#aab2bb');
    });
  }
  function mute(c, g) {
    const b = L.mute;
    roundBtn(c, b, '#5b6470');
    c.fillStyle = '#fff';
    c.beginPath(); c.moveTo(b.x - 13, b.y - 5); c.lineTo(b.x - 6, b.y - 5); c.lineTo(b.x + 2, b.y - 12);
    c.lineTo(b.x + 2, b.y + 12); c.lineTo(b.x - 6, b.y + 5); c.lineTo(b.x - 13, b.y + 5); c.closePath(); c.fill();
    c.strokeStyle = '#fff'; c.lineWidth = 3; c.lineCap = 'round';
    if (g.muted) { c.beginPath(); c.moveTo(b.x + 6, b.y - 6); c.lineTo(b.x + 14, b.y + 6); c.moveTo(b.x + 14, b.y - 6); c.lineTo(b.x + 6, b.y + 6); c.stroke(); }
    else { c.beginPath(); c.arc(b.x + 3, b.y, 9, -0.8, 0.8); c.stroke(); }
  }

  // 规则卡上的小图标
  function lampIcon(c, x, y, color, hat) {
    if (hat) {
      c.beginPath(); c.moveTo(x - 15, y - 22); c.lineTo(x + 15, y - 22); c.lineTo(x + 3, y - 46); c.closePath();
      c.fillStyle = '#ff5fa2'; c.fill();
      c.beginPath(); c.arc(x + 3, y - 46, 5, 0, Math.PI * 2); c.fillStyle = '#ffe24d'; c.fill();
    }
    rr(c, x - 24, y - 24, 48, 48, 12); c.fillStyle = '#2b323b'; c.fill();
    c.beginPath(); c.arc(x, y, 16, 0, Math.PI * 2); c.fillStyle = color === 'red' ? '#ff3b30' : '#34d058'; c.fill();
  }
  function actIcon(c, x, y, go, time) {
    if (go) {
      const k = (time * 1.4) % 1;
      c.beginPath(); c.arc(x, y, 22 + k * 14, 0, Math.PI * 2); c.lineWidth = 3;
      c.strokeStyle = 'rgba(240,160,0,' + (1 - k) + ')'; c.stroke();
      c.beginPath(); c.arc(x, y, 22, 0, Math.PI * 2); c.fillStyle = '#ffc928'; c.fill();
      playIcon(c, x, y, 14);
      text(c, '撳', x + 62, y, 34, '#1f8f3f');
    } else {
      c.beginPath(); c.arc(x, y, 22, 0, Math.PI * 2); c.fillStyle = '#b9bfc6'; c.fill();
      c.fillStyle = '#fff'; c.fillRect(x - 9, y - 10, 6, 20); c.fillRect(x + 3, y - 10, 6, 20);
      text(c, '等', x + 62, y, 34, '#d9362b');
    }
  }
  function arrow(c, x, y) {
    c.strokeStyle = '#8b96a3'; c.lineWidth = 5; c.lineCap = 'round'; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(x - 16, y); c.lineTo(x + 16, y); c.moveTo(x + 6, y - 10); c.lineTo(x + 16, y); c.lineTo(x + 6, y + 10); c.stroke();
  }
  function ruleRow(c, level, go, y, time, act) {
    const x = 400;
    if (level === 0) lampIcon(c, x + 40, y, go ? 'green' : 'red');
    if (level === 2) lampIcon(c, x + 40, y, go ? 'red' : 'green');
    if (level === 3) lampIcon(c, x + 40, y + (go ? 8 : 0), go ? 'red' : 'green', go);
    if (level === 1) {
      lampIcon(c, x, y, 'green');
      if (go) {
        rr(c, x + 52, y - 28, 50, 56, 8); c.fillStyle = '#ffeebd'; c.fill(); c.lineWidth = 3; c.strokeStyle = '#8b96a3'; c.stroke();
        head(c, 'rabbit', x + 77, y, 20);
      } else {
        head(c, 'rabbit', x + 80 + Math.sin(time * 10) * 3, y, 22, '#ff5a3c');
        c.strokeStyle = '#ff5a3c'; c.lineWidth = 3; c.lineCap = 'round';
        c.beginPath(); c.moveTo(x + 46, y - 8); c.lineTo(x + 54, y - 8); c.moveTo(x + 42, y + 6); c.lineTo(x + 52, y + 6); c.stroke();
      }
    }
    arrow(c, x + 150, y);
    actIcon(c, x + 220, y, act, time);
  }

  function dim(c) { c.fillStyle = 'rgba(30,36,44,.45)'; c.fillRect(0, 0, L.W, L.H); }

  function intro(c, g) {
    const m = g.m;
    dim(c);
    rr(c, 150, 80, 660, 380, 32); c.fillStyle = '#fff'; c.fill();
    text(c, LEVEL_NAME[m.level], 480, 134, 46, '#2b323b');
    head(c, 'bear', 262, 296, 74, TILE_BAND[m.level]);
    // 變變變的兩行都是「可以撳」：冇帽睇綠燈，戴帽睇紅燈
    ruleRow(c, m.level, false, 236, m.time, m.level === 3);
    ruleRow(c, m.level, true, 328, m.time, true);
    const ready = m.t >= g.T.introGuard;
    const r = roundBtn(c, L.introPlay, ready ? '#1fae4b' : '#b9bfc6', ready ? (Math.sin(m.time * 5) + 1) * 0.04 : 0);
    playIcon(c, L.introPlay.x, L.introPlay.y, r * 0.6);
  }

  function title(c, g, splash) {
    const m = g.m;
    station(c, THEME[0], true);
    text(c, '紅綠燈站長', 276, 94, 62, '#2b323b', 'left');
    head(c, 'bear', L.bear.x, L.bear.y, L.bear.r, '#00a59b');
    if (splash) {
      const r = roundBtn(c, L.splashPlay, '#1fae4b', (Math.sin(m.time * 4) + 1) * 0.03);
      playIcon(c, L.splashPlay.x, L.splashPlay.y, r * 0.6);
      return;
    }
    mute(c, g);
    // 车厂入口：一列小车 + 已收集数
    const d = L.depot;
    roundBtn(c, d, '#fff');
    miniTrain(c, d.x - 30, d.y - 12, 0.09, SignalModel.LIVERIES[m.depot - 1], [], 0);
    c.beginPath(); c.arc(d.x + 28, d.y - 28, 15, 0, Math.PI * 2); c.fillStyle = '#e0457b'; c.fill();
    text(c, String(m.depot), d.x + 28, d.y - 27, 17, '#fff');
    L.tiles.forEach((t, i) => {
      const open = i <= m.unlocked, band = TILE_BAND[i];
      rr(c, t.x, t.y + 6, t.w, t.h, 26); c.fillStyle = 'rgba(0,0,0,.16)'; c.fill();
      rr(c, t.x, t.y, t.w, t.h, 26); c.fillStyle = open ? '#fff' : '#e3e6ea'; c.fill();
      c.lineWidth = 6; c.strokeStyle = open ? band : '#b9bfc6'; c.stroke();
      const cx = t.x + t.w / 2, cy = t.y + 92;
      c.save(); if (!open) c.globalAlpha = 0.35;
      if (i === 0) { lampIcon(c, cx - 30, cy, 'red'); lampIcon(c, cx + 30, cy, 'green'); }
      if (i === 1) { lampIcon(c, cx - 36, cy, 'green'); head(c, 'rabbit', cx + 30, cy, 30, '#ff5a3c'); }
      if (i === 2) {
        lampIcon(c, cx - 36, cy, 'green'); lampIcon(c, cx + 36, cy, 'red');
        c.strokeStyle = band; c.lineWidth = 5; c.lineCap = 'round';
        c.beginPath(); c.arc(cx, cy, 52, Math.PI * 1.15, Math.PI * 1.85); c.stroke();
        c.beginPath(); c.arc(cx, cy, 52, Math.PI * 0.15, Math.PI * 0.85); c.stroke();
      }
      if (i === 3) { lampIcon(c, cx - 34, cy + 10, 'green'); lampIcon(c, cx + 34, cy + 10, 'red', true); }
      text(c, LEVEL_NAME[i], cx, t.y + 178, 28, '#2b323b');
      c.restore();
      if (open) {
        const n = SignalModel.LEVELS[i].trials.length;
        for (let k = 0; k < n; k++) star(c, cx - (n - 1) * 11 + k * 22, t.y + 218, 9, k < m.best[i] ? '#ffc928' : '#dde1e6');
      } else {
        rr(c, cx - 16, t.y + 208, 32, 24, 5); c.fillStyle = '#8d949c'; c.fill();
        c.beginPath(); c.arc(cx, t.y + 208, 11, Math.PI, 0); c.lineWidth = 5; c.strokeStyle = '#8d949c'; c.stroke();
      }
    });
  }

  function levelDone(c, g) {
    const m = g.m, n = m.trials.length, hasNext = m.passed && m.level < SignalModel.LEVELS.length - 1;
    dim(c);
    if (m.passed) {
      const cols = ['#ff5fa2', '#ffc928', '#34d058', '#3fa9ff', '#a66bff'];
      for (let i = 0; i < 46; i++) {
        const x = (i * 197.3) % L.W, sp = 90 + (i * 37) % 120;
        const y = ((m.t * sp + i * 61) % (L.H + 40)) - 20;
        c.save(); c.translate(x + Math.sin(m.t * 2 + i) * 14, y); c.rotate(m.t * 3 + i);
        c.fillStyle = cols[i % 5]; c.fillRect(-6, -3, 12, 6); c.restore();
      }
    }
    rr(c, 190, 110, 580, 350, 32); c.fillStyle = '#fff'; c.fill();
    head(c, 'bear', 480, 112 + Math.sin(m.time * 4) * (m.passed ? 6 : 0), 58, TILE_BAND[m.level]);
    const shown = Math.min(n, Math.floor(m.t / 0.18));
    m.stars.forEach((ok, i) => {
      const x = 480 - (n - 1) * 31 + i * 62, y = 216;
      if (ok && i < shown) star(c, x, y, 25, '#ffc928', '#b97f00');
      else star(c, x, y, 25, '#e6e9ed', '#c9ced5');
    });
    if (m.newTrain >= 0) {
      // 新列车从右边滑进卡片
      const p = easeOut(clamp01((m.t - 1.2) / 0.9));
      c.save(); c.beginPath(); c.rect(192, 250, 576, 90); c.clip();
      miniTrain(c, 380 + (1 - p) * 420, 262, 0.31, SignalModel.LIVERIES[m.newTrain], ['rabbit', 'panda', 'chick'], m.time);
      c.restore();
      if (p >= 1) [[352, 276], [606, 270], [340, 318], [616, 316]].forEach(([sx, sy], i) =>
        star(c, sx, sy, 7 + Math.sin(m.time * 6 + i * 2) * 3, '#ffc928'));
    }
    const rp = L.replay(hasNext);
    roundBtn(c, rp, hasNext ? '#5b6470' : '#f08a24', hasNext ? 0 : (Math.sin(m.time * 5) + 1) * 0.04);
    c.strokeStyle = '#fff'; c.lineWidth = 6; c.lineCap = 'round';
    c.beginPath(); c.arc(rp.x, rp.y, 18, -0.4, Math.PI * 1.5); c.stroke();
    c.fillStyle = '#fff'; c.beginPath(); c.moveTo(rp.x - 10, rp.y - 26); c.lineTo(rp.x + 8, rp.y - 18); c.lineTo(rp.x - 8, rp.y - 6); c.closePath(); c.fill();
    if (hasNext) {
      const r = roundBtn(c, L.next, '#1fae4b', (Math.sin(m.time * 5) + 1) * 0.04);
      playIcon(c, L.next.x, L.next.y, r * 0.6);
    }
  }

  function depot(c, g) {
    const m = g.m, all = SignalModel.LIVERIES;
    c.fillStyle = '#39424e'; c.fillRect(0, 0, L.W, L.H);
    c.fillStyle = '#4a4f57'; c.fillRect(0, 78, L.W, L.H - 78);
    text(c, '我的列車', 480, 42, 38, '#fff');
    all.forEach((lv, i) => {
      const x = 46 + (i % 4) * 226, y = 108 + Math.floor(i / 4) * 142, own = i < m.depot;
      rr(c, x - 10, y - 12, 212, 124, 16); c.fillStyle = own ? '#e9e4d8' : '#5b6470'; c.fill();
      c.fillStyle = '#39424e'; c.fillRect(x - 10, y + 72, 212, 8);
      if (own) { const A = SignalModel.ANIMALS, n = A.length; miniTrain(c, x, y + 12, 0.29, lv, [A[i % n], A[(i + 3) % n], A[(i + 5) % n]], m.time); }
      else { c.save(); c.globalAlpha = 0.5; miniTrain(c, x, y + 12, 0.29, GHOST); c.restore(); }
    });
    roundBtn(c, L.home, '#5b6470');
    c.fillStyle = '#fff';
    c.beginPath(); c.moveTo(L.home.x, L.home.y - 13); c.lineTo(L.home.x + 14, L.home.y); c.lineTo(L.home.x - 14, L.home.y); c.closePath(); c.fill();
    c.fillRect(L.home.x - 9, L.home.y, 18, 11);
  }

  function draw(c, g) {
    const m = g.m;
    if (m.phase === 'splash' || m.phase === 'title') return title(c, g, m.phase === 'splash');
    if (m.phase === 'depot') return depot(c, g);
    station(c, themeOf(m));
    let off = 0, door = 0, showTrain = !!m.trial;
    if (m.phase === 'arrive') off = -(1 - easeOut(clamp01(m.t / g.T.arrive))) * 820;
    else if (m.phase === 'dwell') door = clamp01(m.t / 0.4);
    else if (m.phase === 'depart') {
      door = 1 - clamp01(m.t / g.T.doorClose);
      off = easeIn(clamp01((m.t - g.T.doorClose) / g.T.depart)) * 960;
    } else showTrain = false;
    if (showTrain) {
      c.save(); c.beginPath(); c.rect(0, 0, L.W, 352); c.clip();
      train(c, L.train.x + off, L.train.y, SignalModel.LIVERIES[m.livery], m.aboard, door, m.time);
      c.restore();
    }
    signal(c, g);
    runner(c, g);
    button(c, g);
    hud(c, g);
    if (m.phase === 'intro') intro(c, g);
    if (m.phase === 'levelDone') levelDone(c, g);
  }

  return { load, draw, LEVEL_NAME };
})();

</script>
<script>
'use strict';
// 外壳：画布缩放、输入、主循环、存储、家长记录。
(() => {
  const L = Layout;
  const cv = document.getElementById('cv'), c = cv.getContext('2d');
  const panel = document.getElementById('parent');
  const g = SignalModel.create();
  g.muted = false;
  let scale = 1, paused = false, last = 0, holdTimer = null;

  const store = {
    get(k, d) { try { const v = localStorage.getItem('signalMaster.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('signalMaster.' + k, JSON.stringify(v)); } catch (e) { /* 存不了照玩 */ } }
  };
  g.restore(store.get('progress', null));
  g.muted = !!store.get('prefs', {}).muted;
  SignalAudio.setMuted(g.muted);
  SignalRender.load();

  function resize() {
    const vw = window.innerWidth, vh = window.innerHeight;
    paused = vh > vw;
    document.body.classList.toggle('portrait', paused);
    scale = Math.min(vw / L.W, vh / L.H);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.style.width = L.W * scale + 'px'; cv.style.height = L.H * scale + 'px';
    cv.width = Math.round(L.W * scale * dpr); cv.height = Math.round(L.H * scale * dpr);
    c.setTransform(cv.width / L.W, 0, 0, cv.height / L.H, 0, 0);
  }

  function flush() {
    g.m.events.splice(0).forEach(e => {
      if (e.t === 'sfx') SignalAudio.sfx(e.name);
      else if (e.t === 'voice') SignalAudio.voice(e.name);
      else if (e.t === 'log') {
        const log = store.get('log', []);
        log.push(Object.assign({ ts: Date.now() }, e.data));
        store.set('log', log.slice(-60));
        store.set('progress', g.snapshot());
      }
    });
  }

  const inCircle = (p, b, pad) => Math.hypot(p.x - b.x, p.y - b.y) <= b.r + (pad || 0);
  const inRect = (p, r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;

  function toggleMute() {
    g.muted = !g.muted;
    SignalAudio.setMuted(g.muted);
    store.set('prefs', { muted: g.muted });
  }

  function tap(p) {
    const m = g.m;
    if (m.phase === 'splash') return g.advance();
    // 车厂页只画了回主页键，别的键（静音）点不到
    if (m.phase === 'depot') { if (inCircle(p, L.home, 8)) g.home(); return; }
    if (inCircle(p, L.mute, 8)) return toggleMute();
    if (m.phase === 'title') {
      if (inCircle(p, L.depot, 8)) { if (g.openDepot()) SignalAudio.sfx('tap'); return; }
      const i = L.tiles.findIndex(t => inRect(p, t));
      if (i >= 0 && g.selectLevel(i)) SignalAudio.sfx('tap');
      return;
    }
    if (inCircle(p, L.home, 8)) return g.home();
    if (m.phase === 'intro') { if (g.advance()) SignalAudio.sfx('tap'); return; }
    if (m.phase === 'levelDone') {
      const hasNext = m.passed && m.level < SignalModel.LEVELS.length - 1;
      if (hasNext && inCircle(p, L.next, 10)) g.next();
      else if (inCircle(p, L.replay(hasNext), 10)) g.replay();
      return;
    }
    // 按钮的命中圈比画的大一圈：小手指按不准
    if (inCircle(p, L.button, 22)) g.press();
  }

  function point(e) {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale };
  }

  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    SignalAudio.unlock();
    if (paused) return;
    const p = point(e);
    // 家长记录：标题页长按小熊 1.5 秒，小朋友乱点点不出来
    if (g.m.phase === 'title' && inCircle(p, L.bear, 6)) holdTimer = setTimeout(showParent, 1500);
    tap(p);
    flush();
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(n => cv.addEventListener(n, () => clearTimeout(holdTimer)));
  cv.addEventListener('contextmenu', e => e.preventDefault());

  window.addEventListener('keydown', e => {
    if (e.repeat) return;
    SignalAudio.unlock();
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (!g.advance() && !g.press()) { if (!g.next()) g.replay(); }
    } else if (e.code === 'KeyM') toggleMute();
    else if (e.code === 'Escape') g.home();
    flush();
  });

  function showParent() {
    const names = SignalRender.LEVEL_NAME;
    const rows = store.get('log', []).slice(-12).reverse().map(r => {
      const d = new Date(r.ts);
      const when = (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
      return '<tr><td>' + when + '</td><td>' + names[r.level] + '</td><td>' + r.stars + ' / ' + r.trains +
        '</td><td>' + r.early + '</td><td>' + ((r.skill | 0) + 1) + '</td><td>' + (r.rt == null ? '–' : r.rt + ' 秒') + '</td></tr>';
    }).join('');
    panel.innerHTML = '<div class="box"><h2>家長記錄</h2>' +
      '<p>忍得住 = 整班車冇搶先撳掣。搶撳次數越少、反應越快，代表「先睇清楚再郁手」做得越好。難度 1–4：一次都冇搶撳，下一輪要等得耐啲；搶得多就自動縮短。</p>' +
      (rows ? '<table><tr><th>時間</th><th>關卡</th><th>忍得住</th><th>搶撳</th><th>難度</th><th>平均反應</th></tr>' + rows + '</table>'
        : '<p>未有記錄，玩完一關就會有。</p>') +
      '<button id="parentClose">關閉</button></div>';
    panel.hidden = false;
    document.getElementById('parentClose').onclick = () => { panel.hidden = true; };
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000 || 0);
    last = now;
    if (!paused && !document.hidden && panel.hidden) { g.update(dt); flush(); }
    SignalRender.draw(c, g);
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  window.__signal = g;   // 浏览器验收脚本读状态用
  requestAnimationFrame(frame);
})();

</script>
</body>
